/* ---------- nakit akış eşitlemesi ----------
   Bugünden itibaren 1 yıl için nakit akıştaki tahmini kalemler kendiliğinden doldurulur:
   • "Pos": son POS çözüm tarihine kadar kasadaki bloke çözümü yazılır (geçecek tutar yoksa 0) ve kalem kesinleşir;
     sonrasındaki günler son 6 ayda hesaba geçen POS'un günlük ortalamasını alır.
   • "Eczane Kasadan Alınan": her gün son 6 ayın günlük ortalaması.
   • "SGK", "Aile ve Sosyal Hiz. Bakanlığı": son 6 ayın aylık ortalaması her ayın 15'ine; kesinleşmiş kalemi olan aylar atlanır.
   • "Depo Ödeme": aylık ortalama; o ay kesinleşmiş depo ödemeleri ve vadesi gelen çek/senetler düşülür, kalanı ayın 15'ine.
   Ortalama = son 6 ayda hesap hareketlerindeki o kategorideki tutarlar ÷ gün (ya da 6 ay), 500 TL'nin katına aşağı yuvarlanır.
   Kalemi olmayan günler/aylar için kalem açılır. Kesinleşti işaretli kalemlere ve ödenmiş kalemlere dokunulmaz. */
const ayKaydir = (iso, n) => { const d = new Date(iso + "T00:00:00"); d.setMonth(d.getMonth() + n); return isoOf(d); };
const asagi500 = v => Math.max(0, Math.floor(v / 500) * 500);
const katBul = ad => S.lk.kategoriler.find(k => trFold(k.ad).trim() === trFold(ad));
const katYon = k => (k.tur === "Gelir" ? "Giren" : k.tur === "Gider" || k.tur === "Ödeme" ? "Çıkan" : "Giren");
const NK_AYLIK = ["SGK", "Aile ve Sosyal Hiz. Bakanlığı", "Depo Ödeme"];
async function katOrtalama(kat, aylik) {
  const yon = katYon(kat), bit = addDays(todayISO(), -1), bas = ayKaydir(todayISO(), -6), gun = dayDiff(bas, bit) + 1, top = new Map();
  for (const h of await S.api.posHareketleri(kat.id, bas, bit)) if (h.isletme_id) top.set(h.isletme_id, (top.get(h.isletme_id) || 0) + (h.yon === yon ? 1 : -1) * +h.tutar);
  return { yon, ort: new Map([...top].map(([i, v]) => [i, asagi500(v / (aylik ? 6 : gun))])), bas, bit, gun };
}
const gunlukOrtalama = kat => katOrtalama(kat, false);
const nkFark = (x, v) => x.tutar == null || Math.abs(+x.tutar - v) >= 0.005;
// eczane için kalem şablonu (hesap sahibi ve hesap): aynı kategorideki en yeni kalem, yoksa herhangi bir kalem
const nkSablon = (isl, ...listeler) => { for (const L of listeler) { const x = L.filter(y => y.isletme_id == isl).sort((a, b) => b.tarih.localeCompare(a.tarih))[0]; if (x) return x; } return null; };
// Aynı gün (ve işletme / kart) için birden fazla kalem varsa kendiliğinden açılmış fazlalar silinir. Elle girilmiş
// (açıklamalı, kesin, ödenmiş ya da harekete bağlı) kalemlere dokunulmaz; tutarı farklı girilmiş tahminler de kalır.
// Önceki sürümde Supabase'in 1000 satır sınırı yüzünden kart ödemeleri her eşitlemede çoğalabiliyordu; bu onları temizler.
async function nkFazlaSil(plan, anahtar) {
  const oto = x => !x.kesin && !x.odendi && !x.hareket_id && !x.aciklama1 && !x.aciklama2, taban = x => (+x.tutar || 0) - (+x.harcama || 0);
  const g = new Map(); for (const x of plan) { const k = anahtar(x); if (!g.has(k)) g.set(k, []); g.get(k).push(x); }
  const sil = new Set();
  for (const L of g.values()) {
    if (L.length < 2) continue;
    const kal = [...L].sort((a, b) => (oto(a) ? 1 : 0) - (oto(b) ? 1 : 0) || Math.abs(taban(b)) - Math.abs(taban(a)) || a.id - b.id)[0];
    for (const x of L) if (x !== kal && oto(x) && (Math.abs(taban(x)) < 0.005 || Math.abs(taban(x) - taban(kal)) < 0.005)) sil.add(x.id);
  }
  if (sil.size) await S.api.nakitTopluSil([...sil]);
  return { plan: sil.size ? plan.filter(x => !sil.has(x.id)) : plan, n: sil.size };
}
async function nkEkleParca(rows) { for (let i = 0; i < rows.length; i += 500) await S.api.nakitEkle(rows.slice(i, i + 500)); return rows.length; }

// günlük kategoriler: tahminleri güncelle, eksik günleri aç
async function nkGunlukDoldur(kat, plan, O, sonTarih, ufuk, ekSablon = []) {
  const today = todayISO(); let n = 0; const yeni = [];
  for (const [isl, avg] of O.ort) {
    const P = plan.filter(x => x.isletme_id == isl), sonT = sonTarih.get(isl) || "", var_ = new Set(P.map(x => x.tarih)), tpl = nkSablon(isl, P, ekSablon);
    const ids = P.filter(x => !x.odendi && !x.kesin && x.yon === O.yon && x.tarih >= today && x.tarih > sonT && nkFark(x, avg)).map(x => x.id);
    if (ids.length) { await S.api.nakitTopluGuncelle(ids, { tutar: avg }); n += ids.length; }
    if (avg > 0) for (let d = sonT && sonT >= today ? addDays(sonT, 1) : today; d <= ufuk; d = addDays(d, 1)) if (!var_.has(d))
      yeni.push({ tarih: d, kisi_id: tpl?.kisi_id ?? null, hesap_id: tpl?.hesap_id ?? null, isletme_id: isl, kategori_id: kat.id, yon: O.yon, tutar: avg, para_birimi: "TRY", kesin: false, odendi: false });
  }
  return n + (yeni.length ? await nkEkleParca(yeni) : 0);
}
// aylık kategoriler: ayın 15'i; düş: "isletme|YYYY-MM" → o ay ortalamadan düşülecek tutar (yalnız Depo Ödeme)
async function nkAylikDoldur(kat, O, ufuk, ekSablon, depo) {
  const today = todayISO(), ay0 = today.slice(0, 7) + "-01";
  const plan = await S.api.nakitListe({ from: ay0, kategori_id: kat.id }, 0, 5000);
  let n = 0; const yeni = [];
  for (const [isl, avg] of O.ort) {
    const P = plan.filter(x => x.isletme_id == isl), tpl = nkSablon(isl, P, ekSablon);
    for (let m = 0; m <= 12; m++) {
      const ay = ayKaydir(ay0, m).slice(0, 7), d15 = ay + "-15";
      if (d15 < today || d15 > ufuk) continue;
      const M = P.filter(x => x.tarih.slice(0, 7) === ay), kesinler = M.filter(x => x.kesin || x.odendi);
      let hedef;
      if (depo) hedef = asagi500(avg - kesinler.reduce((s, x) => s + (+x.tutar || 0), 0) - (depo.get(isl + "|" + ay) || 0));
      else { if (kesinler.length) continue; hedef = avg; }   // kesinleşmiş ay atlanır
      const tah = M.filter(x => !x.kesin && !x.odendi), on5 = tah.find(x => x.tarih === d15) || null;
      for (const x of tah) {
        const v = x === on5 ? hedef : 0;
        if (nkFark(x, v) || x.yon !== O.yon) { await S.api.nakitGuncelle(x.id, { tutar: v, yon: O.yon }); n++; }
      }
      if (!on5 && hedef > 0) yeni.push({ tarih: d15, kisi_id: tpl?.kisi_id ?? null, hesap_id: tpl?.hesap_id ?? null, isletme_id: isl, kategori_id: kat.id, yon: O.yon, tutar: hedef, para_birimi: "TRY", kesin: false, odendi: false });
    }
  }
  return n + (yeni.length ? await nkEkleParca(yeni) : 0);
}
async function kasaNakitEsitle() {
  const today = todayISO(), bas = addDays(today, -14), ufuk = ayKaydir(today, 12), posK = katBul("Pos"), alK = katBul("Eczane Kasadan Alınan");
  let n = 0, sablon = [];
  if (posK) {
    let raw = []; try { raw = await S.api.kasaAralik(addDays(bas, -100), null); } catch (e) { if (!kasaTabloYok(e)) throw e; }
    const { rows, cz } = kasaHesapla(raw), son = new Map();
    for (const r of rows) if (r.cozum && kn(r.pos) > 0 && (!son.has(r.isletme_id) || r.cozum > son.get(r.isletme_id))) son.set(r.isletme_id, r.cozum);
    const [plan0, O] = await Promise.all([S.api.nakitListe({ from: addDays(today, -60), kategori_id: posK.id }, 0, 5000), gunlukOrtalama(posK)]);
    const { plan, n: fz } = await nkFazlaSil(plan0, x => x.isletme_id + "|" + x.tarih); n += fz;
    sablon = plan;
    const yeni = [];
    for (const [isl, sonT] of son) {
      const P = plan.filter(x => x.isletme_id == isl), tpl = nkSablon(isl, P);
      for (let d = bas; d <= sonT; d = addDays(d, 1)) {
        const exp = cz.get(isl + "|" + d) || 0, L = P.filter(x => x.tarih === d);
        if (L.some(x => x.odendi)) continue;   // gerçekleşmiş gün
        const x = L[0];
        if (x) { if (nkFark(x, exp) || !x.kesin || x.yon !== "Giren") { await S.api.nakitGuncelle(x.id, { tutar: exp, kesin: true, yon: "Giren" }); n++; } }
        else if (exp > 0 && d >= today) yeni.push({ tarih: d, kisi_id: tpl?.kisi_id ?? null, hesap_id: tpl?.hesap_id ?? null, isletme_id: isl, kategori_id: posK.id, yon: "Giren", tutar: exp, para_birimi: "TRY", kesin: true, odendi: false });
      }
    }
    if (yeni.length) n += await nkEkleParca(yeni);
    n += await nkGunlukDoldur(posK, plan, O, son, ufuk);
  }
  if (alK) {
    const [plan0, O] = await Promise.all([S.api.nakitListe({ from: today, kategori_id: alK.id }, 0, 5000), gunlukOrtalama(alK)]);
    const { plan, n: fz } = await nkFazlaSil(plan0, x => x.isletme_id + "|" + x.tarih); n += fz;
    n += await nkGunlukDoldur(alK, plan, O, new Map(), ufuk, sablon);
  }
  // aylık: SGK, Aile ve Sosyal Hiz. Bakanlığı, Depo Ödeme
  let depoDus = null;
  for (const ad of NK_AYLIK) {
    const kat = katBul(ad); if (!kat) continue;
    let depo = null;
    if (kat.rol === "depo_odeme") {
      if (!depoDus) { const [conf, bel, elle] = await Promise.all([nakitConf(), S.api.depoBelgeler().catch(() => []), S.api.nakitListe({ kategori_id: kat.id, from: today.slice(0, 7) + "-01" }, 0, 5000)]);
        depoDus = depoAyDusumu(bel, conf, elle); }
      depo = depoDus;
    }
    n += await nkAylikDoldur(kat, await katOrtalama(kat, true), ufuk, sablon, depo);
  }
  return n;
}
// eşitlemeler sırayla çalışır (aynı kalemin iki kez açılmaması için)
let KASA_ESIT = Promise.resolve(0);
function nakitIsSirala(is, sessiz) {
  KASA_ESIT = KASA_ESIT.catch(() => 0).then(is).then(n => { if (n && !sessiz) toast(T("Nakit akışta {n} kalem güncellendi", { n })); return n; }).catch(e => { console.error(e); if (!sessiz) toast(T("Nakit akış eşitlenemedi:") + " " + errMsg(e), true); return 0; });
  return KASA_ESIT;
}
const kasaNakitSirala = sessiz => nakitIsSirala(async () => (await kasaNakitEsitle()) + (await kartNakitEsitle()), sessiz);

/* ---------- POS blokesi: hesaba geçecek tutarlar ve mutabakat ---------- */
async function kasaPos(B) {
  const st = S.kasa, today = todayISO(), from = addDays(today, -45);
  const data = kasaHesapla(await S.api.kasaAralik(addDays(today, -150), null));
  const isls = kasaIsletmeleri(data.rows);
  const posK = katBul("Pos");
  const alK = katBul("Eczane Kasadan Alınan");
  const [hr, O, OA] = await Promise.all([posK ? S.api.posHareketleri(posK.id, from, today) : [], posK ? gunlukOrtalama(posK) : { ort: new Map() }, alK ? gunlukOrtalama(alK) : { ort: new Map() }]);
  const gecen = new Map(); for (const h of hr) { const k = h.isletme_id + "|" + h.tarih; gecen.set(k, r2k((gecen.get(k) || 0) + (h.yon === "Giren" ? 1 : -1) * +h.tutar)); }
  const kaynak = new Map(); for (const r of data.rows) if (r.cozum) { const k = r.isletme_id + "|" + r.cozum; if (!kaynak.has(k)) kaynak.set(k, []); kaynak.get(k).push(r.tarih); }
  const gelecek = [...data.cz.entries()].map(([k, v]) => { const [i, t] = k.split("|"); return { isletme_id: +i, tarih: t, tutar: v }; }).filter(x => x.tarih >= today).sort((a, b) => a.tarih.localeCompare(b.tarih) || isletmeAd(a.isletme_id).localeCompare(isletmeAd(b.isletme_id), "tr"));
  const mut = [];
  for (let t = today; t >= from; t = addDays(t, -1)) for (const i of isls) {
    const k = i.id + "|" + t, exp = data.cz.get(k) || 0, got = gecen.get(k) || 0; if (!exp && !got) continue;
    const fark = r2k(got - exp), durum = Math.abs(fark) < 0.01 ? "ok" : !got ? (t < today ? "yok" : "bek") : fark < 0 ? "eksik" : "fazla";
    mut.push({ tarih: t, isletme_id: i.id, exp, got, fark, durum });
  }
  const DUR = { ok: ["pos", "hesaba geçti"], yok: ["neg", "hesaba geçmedi"], bek: ["", "bekleniyor"], eksik: ["neg", "eksik geçti"], fazla: ["warn", "fazla geçti"] };
  const sorun = mut.filter(x => x.durum === "yok" || x.durum === "eksik" || x.durum === "fazla");
  B.innerHTML = `
  <div class="k-tiles">${isls.map(i => {
    const R = data.byI.get(i.id) || [], bloke = r2k(R.filter(r => r.cozum && r.cozum > today).reduce((s, r) => s + +r.pos, 0));
    const hafta = r2k(gelecek.filter(x => x.isletme_id === i.id && x.tarih > today && x.tarih <= addDays(today, 7)).reduce((s, x) => s + x.tutar, 0)), bugun = data.cz.get(i.id + "|" + today) || 0;
    const sonC = R.reduce((m, r) => (r.cozum && kn(r.pos) > 0 && r.cozum > m ? r.cozum : m), "");
    return `<div class="panel tile"><span class="eyebrow">${esc(i.ad)} · ${T("bloke POS")}</span><span class="v">${money(bloke)}</span>
      <span class="s kv"><span>${T("Bugün hesaba geçecek")}</span><b class="num">${money(bugun)}</b></span>
      <span class="s kv"><span>${T("Sonraki 7 gün")}</span><b class="num">${money(hafta)}</b></span>
      <span class="s kv"><span>${T("Son çözüm tarihi")}</span><b class="num">${sonC ? fdate(sonC) : "—"}</b></span>
      <span class="s kv" title="${esc(T("Son 6 ayda hesaba geçen POS toplamı ÷ gün sayısı, 500 TL'ye aşağı yuvarlanmış. Nakit akışta son çözüm tarihinden sonraki tahmini Pos kalemlerine yazılır."))}"><span>${T("POS günlük tahmin (6 ay)")}</span><b class="num">${O.ort.has(i.id) ? money(O.ort.get(i.id)) : "—"}</b></span>
      <span class="s kv" title="${esc(T("Son 6 ayda kasadan alınan toplamı ÷ gün sayısı, 500 TL'ye aşağı yuvarlanmış. Nakit akıştaki tahmini Eczane Kasadan Alınan kalemlerine yazılır."))}"><span>${T("Kasadan alınan günlük tahmin")}</span><b class="num">${OA.ort.has(i.id) ? money(OA.ort.get(i.id)) : "—"}</b></span></div>`; }).join("")}
    <div class="panel tile"><span class="eyebrow">${T("Mutabakat · son 45 gün")}</span><span class="v ${sorun.length ? "neg" : "pos"}">${sorun.length ? nf0.format(sorun.length) : "✓"}</span>
      <span class="s">${posK ? (sorun.length ? T("beklenenle hesaba geçen arasında fark olan gün") : T("POS tutarlarının hepsi hesaba geçmiş")) : T("Hesap hareketlerinde \"Pos\" adlı kategori bulunamadı")}</span></div>
  </div>
  <div class="grid k-pos" style="margin-top:16px;align-items:start">
    <section class="panel"><div class="panel-h"><h2>${T("Hesaba geçecek POS tutarları")}</h2></div>
      <div class="tw">${gelecek.length ? `<table class="t"><thead><tr><th>${T("Tarih")}</th><th>${T("İşletme")}</th><th>${T("Satış günü")}</th><th class="r">${T("Tutar")}</th></tr></thead><tbody>
        ${gelecek.map(x => `<tr class="${x.tarih === today ? "hl" : ""}"><td class="num">${fdate(x.tarih)} <span class="faint">${esc(gunLabel(daysUntil(x.tarih)))}</span></td><td>${esc(isletmeAd(x.isletme_id))}</td><td class="muted num">${(kaynak.get(x.isletme_id + "|" + x.tarih) || []).map(fdateShort).join(", ")}</td><td class="r num">${money(x.tutar)}</td></tr>`).join("")}
      </tbody></table>` : `<div class="empty">${T("Bloke bekleyen POS tutarı yok.")}</div>`}</div></section>
    <section class="panel"><div class="panel-h"><h2>${T("POS mutabakatı")}</h2><label class="switch"><input type="checkbox" id="kpFark" ${st.sadeceFark ? "checked" : ""}> ${T("Yalnız farklı olanlar")}</label></div>
      <div class="tw">${!posK ? `<div class="empty">${T("Hesap hareketlerinde \"Pos\" adlı kategori bulunamadı. Bankaya geçen POS tutarlarını bu adla kaydederseniz burada karşılaştırılır.")}</div>`
        : `<table class="t"><thead><tr><th>${T("Tarih")}</th><th>${T("İşletme")}</th><th class="r">${T("Beklenen")}</th><th class="r">${T("Hesaba geçen")}</th><th class="r">${T("Fark")}</th><th>${T("Durum")}</th></tr></thead><tbody id="kpBody"></tbody></table>`}</div>
      <div class="sumrow"><span class="muted">${T("Beklenen: kasa kayıtlarındaki POS tutarlarının çözüm gününe düşen toplamı. Hesaba geçen: o gün o eczane için girilmiş \"Pos\" hesap hareketleri.")}</span></div></section>
  </div>`;
  const ciz = () => {
    const tb = $("#kpBody", B); if (!tb) return;
    const L = st.sadeceFark ? sorun : mut;
    tb.innerHTML = L.length ? L.map(x => `<tr class="${x.tarih === today ? "hl" : ""}"><td class="num">${fdate(x.tarih)}</td><td>${esc(isletmeAd(x.isletme_id))}</td><td class="r num">${x.exp ? nf2.format(x.exp) : ""}</td><td class="r num">${x.got ? nf2.format(x.got) : ""}</td>
      <td class="r num ${x.durum === "bek" ? "" : Math.abs(x.fark) >= 0.01 ? (x.fark < 0 ? "neg" : "pos") : "faint"}">${x.durum === "bek" ? "" : Math.abs(x.fark) >= 0.01 ? nf2.format(x.fark) : "0"}</td><td><span class="badge ${DUR[x.durum][0]}">${T(DUR[x.durum][1])}</span></td></tr>`).join("")
      : `<tr><td colspan="6"><div class="empty">${st.sadeceFark ? T("Fark olan gün yok.") : T("Bu dönemde POS kaydı yok.")}</div></td></tr>`;
  };
  $("#kpFark", B).onchange = e => { st.sadeceFark = e.target.checked; ciz(); };
  ciz();
}

/* ---------- aylık özet ---------- */
async function kasaOzet(B) {
  const st = S.kasa, [ilk, son] = await S.api.kasaUcTarih();
  if (!ilk) { B.innerHTML = `<section class="panel"><div class="empty">${T("Henüz kasa kaydı yok.")}</div></section>`; return; }
  const yillar = []; for (let y = +son.slice(0, 4); y >= +ilk.slice(0, 4); y--) yillar.push(y);
  if (!yillar.includes(st.yil)) st.yil = yillar[0];
  const y = st.yil, data = kasaHesapla(await S.api.kasaAralik(`${y - 1}-09-01`, `${y + 1}-01-20`));
  const rows = data.rows.filter(r => r.tarih.startsWith(y + "-"));
  const islIds = [...new Set(rows.map(r => r.isletme_id))].sort((a, b) => isletmeAd(a).localeCompare(isletmeAd(b), "tr"));
  const OL = [["nakit_giris", "Nakit giriş"], ["fark", "Kasa farkı"], ["alinan", "Kasadan alınan"], ["pos_toplam", "POS toplam"], ["havale", "Hesaba transfer"], ["banka", "Banka toplamı"], ["tahsilat", "Toplam tahsilat"]];
  const topla = L => { const o = {}; for (const [k] of OL) o[k] = r2k(L.reduce((s, r) => s + (kn(r[k]) || 0), 0)); return o; };
  const hucre = (o, b) => OL.map(([k]) => `<td class="r num ${k === "fark" && Math.abs(o[k]) >= 1 ? (o[k] < 0 ? "neg" : "pos") : ""}">${b ? "<b>" : ""}${nf2.format(o[k])}${b ? "</b>" : ""}</td>`).join("");
  B.innerHTML = `<section class="panel">
    <div class="panel-h"><div class="seg" role="group" aria-label="${esc(T("Yıl"))}">${yillar.map(x => `<button data-kyil="${x}" aria-pressed="${x === y}">${x}</button>`).join("")}</div></div>
    <div class="tw"><table class="t k-ozet"><thead><tr><th>${T("Dönem")}</th>${OL.map(([, t]) => `<th class="r">${T(t)}</th>`).join("")}</tr></thead><tbody>
      ${islIds.map(i => { const L = rows.filter(r => r.isletme_id === i);
        return `<tr class="day"><td><b>${esc(isletmeAd(i))}</b></td>${hucre(topla(L), true)}</tr>` +
          [...Array(12).keys()].map(mo => { const M = L.filter(r => +r.tarih.slice(5, 7) === mo + 1); return M.length ? `<tr><td>${esc(ayAdi(mo))}</td>${hucre(topla(M))}</tr>` : ""; }).join(""); }).join("")}
      ${islIds.length > 1 ? `<tr class="day"><td><b>${T("Genel toplam")}</b></td>${hucre(topla(rows), true)}</tr>` : ""}
    </tbody></table></div>
    <div class="sumrow"><span class="muted">${T("Kasa farkı ve toplam tahsilat yalnız gün sonu girilmiş günler için hesaplanır. Kasadan alınan, ertesi günün devri girilince hesaplanır.")}</span></div></section>`;
  $$("[data-kyil]", B).forEach(b => b.onclick = () => { st.yil = +b.dataset.kyil; kasaOzet(B); });
}

  const banks = S.lk.hesaplar.filter(h => (h.tur === "Banka" || h.tur === "Kasa") && h.aktif !== false).map(h => ({ id: h.id, label: hesapAd(h.id) })).sort((a, b) => a.label.localeCompare(b.label, "tr"));
  const bankAccs = [...pfEsleme()].filter(([, hid]) => bankLike(hesap(hid))).map(([pf]) => pf);

  const html = pfHtml(), at = html.indexOf("<script>");
  const init = `<script>window.PF_INIT=${safeJson({ data, status: S.api.mode === "live" ? T("veritabanı") : T("demo · değişiklikler saklanmaz"), lang: LANG, theme: pfThemeValue(), fd })};<\/script>\n`;
  const f = document.createElement("iframe");
  f.className = "pf-frame"; f.title = T("Yatırım takibi");

/* =====================================================================
   YATIRIM ↔ HESAP HAREKETLERİ EŞİTLEMESİ
   1) Yatırım takibinden: banka/kasa ile eşleşen hesaplardaki alım-satım, temettü, faiz, masraf → "Alım-Satım"
      aracı kuruma para yatırma/çekme (banka seçildiyse) → bankada "Yatırım" hareketi
   2) Hesap hareketlerinden: "Alım-Satım" (yatırım bilgisiyle) ve "Yatırım" (karşı hesap aracı kurum) → yatırım takibi
   Kayıt hangi taraftan girildiyse orada düzenlenir; diğer taraftaki kopyası otomatik güncellenir.

const SYNC = { conf: null, running: null, again: false, timer: 0, accs: null, last: null };
async function syncConf(force) {

  return SYNC.conf;
}
function syncYatirimSoon(ms = 600) { clearTimeout(SYNC.timer); SYNC.timer = setTimeout(() => syncYatirim().catch(e => toast(T("Yatırım eşitlemesi yapılamadı:") + " " + errMsg(e), true)), ms); }
const r2 = x => Math.round(x * 100) / 100;
const bankLike = h => !!h && (h.tur === "Banka" || h.tur === "Kasa");
function pfLinks() { const m = new Map(); for (const [pf, hid] of pfEsleme()) { const h = hesap(hid); if (h) m.set(pf, h); } return m; }
// Finans Defteri hesabına bağlı yatırım hesaplarından para birimine uyanı (yoksa ilkini) seçer
function pfSec(hid, cur, accs) { const ids = hesapPf(hid).filter(id => accs.has(id)); return ids.find(id => accs.get(id).cur === cur) || ids[0]; }
const canon = o => JSON.stringify(o == null ? null : Object.keys(o).sort().reduce((a, k) => { if (o[k] != null && o[k] !== "") a[k] = typeof o[k] === "number" ? r2(o[k] * 10000) / 10000 : o[k]; return a; }, {}));
function pfDesiredFD(PS, conf, kat) {
  const links = pfLinks(), out = new Map(), accs = new Map((PS.accounts || []).map(a => [a.id, a]));
  for (const t of PS.tx || []) {
    if (t.fd || !t.d || t.d < conf.start) continue;
    const acc = accs.get(t.a); if (!acc) continue;
    const hs = links.get(t.a);
    if (bankLike(hs) && PF_TRADE.includes(t.ty) && kat.alim_satim) {
      const mult = PS.assets?.[t.s]?.type === "Option" ? 100 : 1, f = +t.f || 0;
      const c = r2(t.ty === "Buy" ? -(t.q * t.p * mult + f) : t.ty === "Sell" ? t.q * t.p * mult - f : t.ty === "Dividend" ? t.q * t.p - f : (PF_YON[t.ty] === "Giren" ? 1 : -1) * Math.abs(+t.m || 0));
      if (Math.abs(c) < 0.005) continue;
      const ek = { İşlem: t.ty };
      if (!PF_CASH.has(t.ty)) { Object.assign(ek, { Sembol: t.s, Adet: +t.q, Fiyat: +t.p, Komisyon: f }); const at = PS.assets?.[t.s]?.type; if (at && t.ty !== "Dividend") ek.Tür = at; }
      out.set(t.id, { kaynak: "yatirim", kaynak_id: t.id, tarih: t.d, hesap_id: hs.id, kategori_id: kat.alim_satim, yon: c > 0 ? "Giren" : "Çıkan", tutar: Math.abs(c), para_birimi: acc.cur, karsi_hesap_id: null, aciklama1: null, ek });
    } else if ((t.ty === "Deposit" || t.ty === "Withdraw") && t.fb && hesap(t.fb) && !bankLike(hs) && kat.yatirim) {
      const cur = t.fbc || "TRY", rate = t.x > 0 ? t.x : (PS.fxh?.[t.d] || PS.fx || 1);
      const amt = t.fbt > 0 ? +t.fbt : acc.cur === cur ? +t.m : acc.cur === "USD" && cur === "TRY" ? t.m * rate : acc.cur === "TRY" && cur === "USD" ? t.m / rate : +t.m;
      out.set(t.id, { kaynak: "yatirim", kaynak_id: t.id, tarih: t.d, hesap_id: +t.fb, kategori_id: kat.yatirim, yon: t.ty === "Deposit" ? "Çıkan" : "Giren", tutar: r2(amt), para_birimi: cur, karsi_hesap_id: hs?.id ?? null, aciklama1: [acc.owner, acc.name].filter(Boolean).join(" · "), ek: { İşlem: t.ty, YatirimTutar: +t.m, YatirimPB: acc.cur } });
    }

}
const PF_EK_KEYS = ["İşlem", "Sembol", "Adet", "Fiyat", "Komisyon", "Tür", "YatirimTutar", "YatirimPB"];
const ekPick = (o, keep) => Object.fromEntries(Object.entries(o || {}).filter(([k]) => PF_EK_KEYS.includes(k) === keep));
// Aynanın kendi alanları güncellenir; kullanıcının ek alanları (Excel'den gelenler gibi) korunur
const mirrorRow = (w, h) => ({ ...w, ek: { ...ekPick(h?.ek, false), ...w.ek } });
// Aynı işlem iki tarafta da elle girildiyse (ya da Excel'den geldiyse) yeni kayıt açmak yerine mevcut kaydı bağla
function pfFindTwin(pool, used, w) {
  const tol = Math.max(1, w.tutar * 0.0005), sym = String(w.ek?.Sembol || "").toUpperCase();
  let best = null, bd = Infinity;
  for (const h of pool) {
    if (used.has(h.id) || h.tarih !== w.tarih || +h.hesap_id !== +w.hesap_id || h.yon !== w.yon || h.para_birimi !== w.para_birimi) continue;
    const hs = String(h.ek?.Sembol || "").toUpperCase(); if (sym && hs && hs !== sym) continue;
    const d = Math.abs(+h.tutar - w.tutar); if (d <= tol && d < bd) { best = h; bd = d; }
  }
  return best;
}
const sameMirror = (h, w) => h.tarih === w.tarih && +h.hesap_id === +w.hesap_id && +h.kategori_id === +w.kategori_id && h.yon === w.yon && Math.abs(+h.tutar - +w.tutar) < 0.005 &&
  h.para_birimi === w.para_birimi && (h.karsi_hesap_id ?? null) == (w.karsi_hesap_id ?? null) && (h.aciklama1 || "") === (w.aciklama1 || "") && canon(ekPick(h.ek, true)) === canon(w.ek);
function pfDesiredTracker(cands, PS) {
  const accs = new Map((PS.accounts || []).map(a => [a.id, a])), out = new Map(), assets = {};
  for (const h of cands) {
    const ek = h.ek || {};
    if (h.kategori_rol === "alim_satim") {
      const aid = pfSec(h.hesap_id, h.para_birimi, accs); if (!accs.has(aid) || !PF_TRADE.includes(ek.İşlem)) continue;
      const cashOnly = PF_CASH.has(ek.İşlem);
      const tx = { id: "fd" + h.id, fd: h.id, d: h.tarih, a: aid, ty: ek.İşlem, s: cashOnly ? "" : String(ek.Sembol || "").toUpperCase(), q: cashOnly ? 0 : +ek.Adet || 0, p: cashOnly ? 0 : +ek.Fiyat || 0, f: cashOnly ? 0 : +ek.Komisyon || 0, m: cashOnly ? r2(Math.abs(+h.net)) : 0, u: "", k: 0, cp: "", x: 0, n: "Finans Defteri" };
      if (!tx.s && !cashOnly) continue;
      out.set(tx.id, tx); if (tx.s && ek.Tür) assets[tx.s] = ek.Tür;
    } else if (h.kategori_rol === "yatirim") {
      // Aynı aracı kurumun birden fazla para birimindeki hesabı varsa, girilen para birimine uyanı seç (ör. İş Yatırım TRY / USD)
      const wantCur = ek.YatirimPB || h.para_birimi;
      let aid = pfSec(h.karsi_hesap_id, wantCur, accs), acc = accs.get(aid); if (!acc || !bankLike(hesap(h.hesap_id))) continue;
      if (acc.cur !== wantCur) { const sib = (PS.accounts || []).find(x => x.owner === acc.owner && x.name === acc.name && x.cur === wantCur); if (sib) { aid = sib.id; acc = sib; } }
      const amt = Math.abs(+h.net); if (!amt) continue;
      let m, x = 0;
      if (+ek.YatirimTutar > 0 && (ek.YatirimPB || acc.cur) === acc.cur) { m = +ek.YatirimTutar; if (h.para_birimi === "TRY" && acc.cur === "USD") x = amt / m; }
      else if (h.para_birimi === acc.cur) m = amt;
      else { const rate = PS.fxh?.[h.tarih] || PS.fx || 1; m = h.para_birimi === "TRY" && acc.cur === "USD" ? amt / rate : h.para_birimi === "USD" && acc.cur === "TRY" ? amt * rate : amt; x = rate; }
      out.set("fd" + h.id, { id: "fd" + h.id, fd: h.id, d: h.tarih, a: aid, ty: +h.net < 0 ? "Deposit" : "Withdraw", s: "", q: 0, p: 0, f: 0, m: r2(m), u: "", k: 0, cp: "", x: x ? +(+x).toFixed(4) : 0, n: "Finans Defteri" + (h.aciklama1 ? ": " + h.aciklama1 : "") });
    }
  }

}
const normTx = t => [t.d, t.a, t.ty, t.s || "", +t.q || 0, +t.p || 0, +t.f || 0, +t.m || 0, +t.x || 0, t.n || "", +t.fd || 0];
function pfApplyChanges(PS, up, rm, assets) {
  const rmSet = new Set(rm); PS.tx = (PS.tx || []).filter(t => !rmSet.has(t.id));
  for (const tx of up) { const i = PS.tx.findIndex(t => t.id === tx.id); if (i >= 0) PS.tx[i] = tx; else PS.tx.push(tx); }
  PS.assets = PS.assets || {};
  for (const [s, ty] of Object.entries(assets || {})) { if (!PS.assets[s]) PS.assets[s] = { type: ty, px: 0 }; else if (!PS.assets[s].type) PS.assets[s].type = ty; }
}
async function pfApplyTracker(up, rm, assets) {
  if (PF.frame && PF.data) { pfPost({ type: "fdsync", upsert: up, remove: rm, assets }); return; }
  for (let attempt = 0; attempt < 2; attempt++) {
    const res = await S.api.yatirimYukle(), PS = pfJoin(res.parts);
    const before = pfStrings(pfSplit(PS)); pfApplyChanges(PS, up, rm, assets);
    const parts = pfSplit(PS), after = pfStrings(parts), send = {}, del = [];
    for (const k in after) if (after[k] !== before[k]) send[k] = parts[k];
    for (const k in before) if (!(k in after)) del.push(k);
    if (!Object.keys(send).length && !del.length) return;
    try { await S.api.yatirimKaydet(res.surum, send, del); return; } catch (e) { if (!e.conflict || attempt) throw e; }

async function syncYatirim() {
  if (SYNC.running) { SYNC.again = true; return SYNC.running; }
  SYNC.running = (async () => {
    const conf = await syncConf(); if (!conf?.on || !conf.start) return;
    let PS = PF.frame && PF.data ? PF.data : null;
    if (!PS) { const r = await S.api.yatirimYukle(); if (!r.parts.ana) return; PS = pfJoin(r.parts); }
    SYNC.accs = PS.accounts || [];
    const kat = { alim_satim: rolKategori("alim_satim")?.id, yatirim: rolKategori("yatirim")?.id };
    const want = pfDesiredFD(PS, conf, kat), have = await S.api.yatirimAynalari();
    const haveBy = new Map(), ups = [], dels = [];
    for (const h of have) { if (haveBy.has(h.kaynak_id)) dels.push(h.id); else haveBy.set(h.kaynak_id, h); }
    let ins = [], adopted = 0;
    for (const [id, w] of want) { const h = haveBy.get(id); if (!h) ins.push(w); else if (!sameMirror(h, w)) ups.push([h.id, mirrorRow(w, h)]); }
    for (const h of haveBy.values()) if (!want.has(h.kaynak_id)) dels.push(h.id);
    if (ins.length) {
      const ds = ins.map(w => w.tarih).sort(), pool = await S.api.yatirimIkizleri([...new Set(ins.map(w => w.hesap_id))], ds[0], ds[ds.length - 1]), used = new Set();
      ins = ins.filter(w => { const h = pfFindTwin(pool, used, w); if (!h) return true; used.add(h.id); ups.push([h.id, mirrorRow(w, h)]); adopted++; return false; });
    }
    if (ins.length) await S.api.ekle(ins);
    for (const [id, w] of ups) await S.api.guncelle(id, w);
    for (const id of dels) await S.api.sil(id);
    const cands = await S.api.yatirimAdaylari(conf.start, conf.acilis || "1970-01-01T00:00:00Z");
    const { out, assets } = pfDesiredTracker(cands, PS);
    const cur = new Map((PS.tx || []).filter(t => t.fd).map(t => [t.id, t])), up = [], rm = [];
    for (const [id, tx] of out) { const c = cur.get(id); if (!c || JSON.stringify(normTx(c)) !== JSON.stringify(normTx(tx))) up.push(tx); }
    for (const id of cur.keys()) if (!out.has(id)) rm.push(id);
    const needAssets = Object.keys(assets).some(s => !PS.assets?.[s]?.type);
    if (up.length || rm.length || needAssets) await pfApplyTracker(up, rm, assets);
    const n = ins.length + ups.length + dels.length + up.length + rm.length;
    SYNC.last = { at: Date.now(), n, adopted };
    if (n && !$(".drawer") && S.view !== "yatirim") refreshView();
  })();
  // Başka bir bilgisayar aynı anda eşitlediyse benzersizlik kuralı çift aynayı reddeder: sessizce yeniden dene
  try { await SYNC.running; SYNC.retry = 0; } catch (e) { if (e?.code !== "23505" || (SYNC.retry = (SYNC.retry || 0) + 1) > 3) { SYNC.retry = 0; throw e; } SYNC.again = true; } finally { SYNC.running = null; if (SYNC.again) { SYNC.again = false; syncYatirimSoon(300); } }
}
function pfAccLabel(id) { const a = (SYNC.accs || PF.data?.accounts || []).find(x => x.id === id); return a ? [a.owner, a.name].filter(Boolean).join(" · ") + ` (${a.cur})` : ""; }
function pfLinkLabel(hid) {
  const h = hesap(hid); if (!h) return "";
  if (!SYNC.conf?.on) return T("Yatırım eşitlemesi kapalı (Ayarlar). Kayıt sadece burada kalır.");
  const pfs = hesapPf(h.id);
  if (!pfs.length || !bankLike(h)) return T("Bu hesap yatırım takibindeki bir banka/kasa hesabıyla eşleşmemiş; kayıt sadece burada kalır.");
  return T("Yatırım takibine de işlenir: {h}", { h: esc(pfs.map(pfAccLabel).filter(Boolean).join(" / ") || h.ad) });
}
function pfBrokerHint(hid, giris) {
  const h = hesap(hid); if (!h) return T("Yatırım hesabını seçin. Yatırım takibine işlenmesi için hesabın orada bir karşılığı olmalı.");
  if (!SYNC.conf?.on) return T("Yatırım eşitlemesi kapalı (Ayarlar). Kayıt sadece burada kalır.");
  const pfs = hesapPf(h.id);
  if (!pfs.length) return T("Bu hesap yatırım takibinde bir hesapla eşleşmemiş; kayıt sadece burada kalır.");
  return T("Yatırım takibine {ty} olarak işlenir: {h}", { ty: TP(giris ? "Withdraw" : "Deposit"), h: esc(pfs.map(pfAccLabel).filter(Boolean).join(" / ") || h.ad) });
}
