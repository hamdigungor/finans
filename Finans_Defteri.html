<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Finans Defteri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<style>
/* Layout: sabit sol menü + kayan çalışma alanı; dar ekranda üst menü. Defter mantığı: özet önce, detay sonra. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EBEEF3; --line:#D9DEE7; --line-strong:#C3CAD6;
  --fg:#152033; --muted:#5B6678; --faint:#8A94A6;
  --accent:#2C4FA3; --accent-soft:#E3E9F7; --accent-ink:#FFFFFF;
  --we-row:#FBF6EC; --we-day:#F2E8D4; --we-ink:#8A5A12;
  --pos:#1B7A4B; --pos-soft:#E1F2E8; --neg:#B23F2C; --neg-soft:#F8E4E0; --warn:#9A6200; --warn-soft:#F7ECD6;
  --shadow:0 1px 2px rgba(21,32,51,.06),0 8px 24px rgba(21,32,51,.06);
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#151B24; --surface-2:#1C2330; --line:#283141; --line-strong:#364153;
  --fg:#E5E9F0; --muted:#97A3B6; --faint:#6D788A;
  --accent:#86A2F5; --accent-soft:#1F2A44; --accent-ink:#0E131A;
  --we-row:#1C1A15; --we-day:#2A251B; --we-ink:#E2B865;
  --pos:#56C48E; --pos-soft:#15291F; --neg:#F08A74; --neg-soft:#33191A; --warn:#E3B14E; --warn-soft:#30260F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#151B24; --surface-2:#1C2330; --line:#283141; --line-strong:#364153;
  --fg:#E5E9F0; --muted:#97A3B6; --faint:#6D788A;
  --accent:#86A2F5; --accent-soft:#1F2A44; --accent-ink:#0E131A;
  --we-row:#1C1A15; --we-day:#2A251B; --we-ink:#E2B865;
  --pos:#56C48E; --pos-soft:#15291F; --neg:#F08A74; --neg-soft:#33191A; --warn:#E3B14E; --warn-soft:#30260F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)} .faint{color:var(--faint)}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:15px;font-family:var(--f-mono)}
.brand b{display:block;font-size:14px}
.brand small{display:block;color:var(--muted);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav svg{width:17px;height:17px;flex:none}
.side .spacer{flex:1}
.mode-pill{font-size:11.5px;padding:6px 10px;border-radius:6px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.mode-pill.live{background:var(--pos-soft);color:var(--pos)}
.main{min-width:0;padding-block:22px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{margin:4px 0 0;color:var(--muted)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 45%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:15px;height:15px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 9px;color:var(--fg);min-width:0}
textarea.i{resize:vertical;min-height:60px}
input.i:focus,select.i:focus,textarea.i:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input.i.amount{font-family:var(--f-mono);font-size:17px;text-align:right}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;padding:2px;background:var(--surface-2);gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:5px 12px;border-radius:5px;font-weight:500;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--fg)}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:500;white-space:nowrap}
.badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.neg{background:var(--neg-soft);color:var(--neg)} .badge.pos{background:var(--pos-soft);color:var(--pos)} .badge.acc{background:var(--accent-soft);color:var(--accent)}

/* panels */
.grid{display:grid;gap:16px}
.g-tiles{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-b{padding:14px 16px}
.panel-b.flush{padding:0}
.tile{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tile .v{font-family:var(--f-mono);font-size:clamp(15px,1.22vw,20px);font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:12.5px;color:var(--muted)}
.tile .s.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;white-space:nowrap;min-width:0}
.tile .s.kv > span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tile .s.kv > b{flex-shrink:0;color:var(--fg);font-weight:500}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.hi > i{background:var(--neg)} .bar.mid > i{background:var(--warn)}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{position:sticky;top:0;background:var(--surface);text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
.t td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.t td.r,.t th.r{text-align:right}
.t td.num{white-space:nowrap}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover td{background:var(--surface-2)}
.t tr.sub td{background:var(--surface-2);font-weight:600}
.t tr.tot td{border-top:1.5px solid var(--line-strong);font-weight:600;background:var(--surface)}
.t td.cell{cursor:pointer}
.t td.cell:hover{background:var(--accent-soft)}
.t .z{color:var(--faint)}
.t .grp-toggle{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.t .grp-toggle:focus-visible{outline:2px solid var(--accent)}
.tw.tall{max-height:520px;overflow:auto}
.tw.t27{max-height:calc(27 * 35.7px + 35px);overflow:auto}   /* Tanımlar: 27 satır görünür */
.desc{color:var(--muted);font-size:12.5px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-cell b{font-weight:500}
.acc-cell small{display:block;color:var(--muted);font-size:12px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* filters */
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.filters .wide{grid-column:span 2}
.sumrow{display:flex;gap:18px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-2);font-size:13px;border-radius:0 0 var(--r) var(--r)}
.sumrow b{font-weight:600}
.pager{display:flex;align-items:center;gap:8px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer-b{padding:16px 18px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.drawer-b > *{flex-shrink:0}   /* içerik sıkışmasın, çekmecenin tamamı kaysın */
#eFields{display:flex;flex-direction:column;gap:14px}
#eRecent:empty{display:none}
.drawer-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.drawer-f .left{margin-right:auto}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.frow.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.hint{font-size:12px;color:var(--faint)}
.arrow-box{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:end}
.arrow-box .arr{padding-bottom:8px;color:var(--muted)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:10px;z-index:51;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px}
.modal-scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:50}
.toast-wrap{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:7px;font-size:13.5px;box-shadow:var(--shadow);max-width:min(520px,calc(100vw - 32px))}
.toast.err{background:var(--neg);color:#fff}

/* welcome */
.welcome{max-width:880px;margin:0 auto;padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.welcome h1{font-size:28px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--fg)}
.steps li::marker{color:var(--accent);font-family:var(--f-mono)}
.loading{padding:40px;text-align:center;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg.chart text{fill:var(--muted);font-family:var(--f-sans);font-size:11px}
svg.chart .grid line{stroke:var(--line)}
.progress{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;color:var(--muted)}

.main.full{padding:0}
.pf-frame{display:block;width:100%;height:100vh;border:0;background:var(--bg)}
.pf-msg{max-width:640px;margin:40px auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:1300px){.g-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1100px){.g-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.g-2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
  .brand{padding:0 6px 0 0}.brand div{display:none}
  .nav{flex-direction:row}
  .nav button span{display:none}
  .nav button{padding:8px}
  .side .spacer,.side .mode-pill{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .frow.three{grid-template-columns:minmax(0,1fr)}
  .pf-frame{height:calc(100dvh - 58px)}
}
@media (max-width:520px){.g-tiles{grid-template-columns:minmax(0,1fr)}.frow{grid-template-columns:minmax(0,1fr)}.filters .wide{grid-column:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* eklemeler: bağlantı rozetleri, salt okunur bilgi kutusu, ayar satırları */
.link-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap;vertical-align:1px}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:7px;background:var(--accent-soft);color:var(--fg);font-size:13px}
.note.warn{background:var(--warn-soft)}
.note b{font-weight:600}
.kv{display:grid;grid-template-columns:minmax(110px,max-content) minmax(0,1fr);gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .lbl{display:flex;flex-direction:column;gap:2px;min-width:0}
.set-row .lbl small{color:var(--muted);font-size:12.5px}
.inv-box{display:flex;flex-direction:column;gap:12px;padding:12px;border:1px dashed var(--line-strong);border-radius:8px}
.inv-box .ttl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.depo-grp{margin-bottom:16px}
.t td.dim{color:var(--faint)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:500}
.switch input{width:16px;height:16px;accent-color:var(--accent)}
/* nakit akış */
.nk-tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
.click-tile{cursor:pointer}
.click-tile:hover{border-color:var(--line-strong)}
.click-tile u{text-decoration-color:var(--faint);text-underline-offset:2px}
.t tr.day td{background:var(--surface-2);font-size:12.5px;color:var(--muted);padding-top:6px;padding-bottom:6px}
.t tr.day td b{color:var(--fg);font-weight:600}
.t tr.we td{background:var(--we-row)}
.t tr.day.we td{background:var(--we-day)}
.t tr.day.we td b{color:var(--we-ink)}
.t tr.day.today td{background:var(--accent-soft)}
.t tr.day.late td{background:var(--neg-soft)}
.t tr.subrow td{font-size:12.5px;color:var(--muted);background:var(--surface)}
.t td.act{width:1%;white-space:nowrap}
.t td.act .num{margin-right:8px}
.btn.ok{color:var(--pos);border-color:color-mix(in srgb,var(--pos) 40%,var(--line));min-width:30px}
.btn.ok:hover{background:var(--pos-soft)}
.nk-chart{padding:10px 12px 2px}
svg.chart .zero{stroke:var(--neg);stroke-opacity:.5;stroke-dasharray:3 3}
.nk-mini{display:flex;gap:18px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.nk-mini b{color:var(--fg)} .nk-mini b.pos{color:var(--pos)} .nk-mini b.neg{color:var(--neg)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line)}
.cal .wd{background:var(--surface);padding:6px 8px;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.cal .d{all:unset;box-sizing:border-box;background:var(--surface);min-height:92px;padding:6px 8px;display:flex;flex-direction:column;gap:1px;cursor:pointer;font-size:12px;min-width:0;position:relative}
.cal .d:hover{background:var(--surface-2)}
.cal .d:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cal .d.we{background:var(--we-row)}
.cal .d.we:hover{background:var(--surface-2)}
.cal .d.out{background:var(--bg);cursor:default}
.cal .d.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .d.negb{background:var(--neg-soft)}
.cal .d .n{font-weight:600;font-size:12.5px;align-self:flex-start;padding:0 5px;margin-left:-5px;border-radius:999px}
.cal .d.today .n{background:var(--accent);color:var(--accent-ink)}
.cal .d .g,.cal .d .c,.cal .d .b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.cal .d .b{margin-top:auto;color:var(--muted)}
.cal .d .b.neg{color:var(--neg);font-weight:600}
.cal .d .dot{position:absolute;top:9px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--accent);display:none}
.cal .d .dot.late{background:var(--neg)}
@media (max-width:1100px){.nk-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.cal .d{min-height:58px;padding:4px 5px}.cal .d .g,.cal .d .c{display:none}.cal .d .dot{display:block;top:6px;right:5px}.cal .wd{padding:5px 4px;font-size:10px;letter-spacing:0}}

function pfEsleme() {

}

/* Ekran yenilenirken sayfanın ve içteki kaydırılabilir tabloların konumu korunur (kayıttan sonra yukarı kaymasın) */
const KAYDIR_SEC = ".tw, .nk-scroll, .drawer-b";
function kaydirmaAl(root) {
  const L = root ? $$(KAYDIR_SEC, root).map((el, i) => ({ i, id: el.id || "", top: el.scrollTop, left: el.scrollLeft })).filter(x => x.top || x.left) : [];
  return { x: window.scrollX, y: window.scrollY, L };
}
function kaydirmaVer(k, root) {
  if (!k) return;
  const els = root ? $$(KAYDIR_SEC, root) : [];
  for (const s of k.L) { const el = (s.id && root.querySelector("#" + CSS.escape(s.id))) || els[s.i]; if (el) { el.scrollTop = s.top; el.scrollLeft = s.left; } }
  window.scrollTo(k.x, k.y);
}
// fn çalışırken ana alan yüksekliğini tutar (içerik bir an boşalınca sayfa yukarı atlamasın), bitince konumu geri verir
async function koruyarak(fn) {
  const m = $("#main"), k = kaydirmaAl(m); if (m) m.style.minHeight = m.offsetHeight + "px";
  try { return await fn(); }
  finally { const m2 = $("#main"); kaydirmaVer(k, m2); setTimeout(() => { kaydirmaVer(k, m2); if (m2) m2.style.minHeight = ""; }, 350); }
}
async function go(v) {
  if (!VIEWS[v]) v = "ozet";
  const ayni = v === S.view && !!$("#main")?.firstElementChild, k = ayni ? kaydirmaAl($("#main")) : null, h = ayni ? $("#main").offsetHeight : 0;
  if (S.view === "yatirim" && PF.frame && v !== S.view) { const m0 = $("#main"); if (m0) m0.innerHTML = `<div class="loading">${T("Kaydediliyor…")}</div>`; await pfIdle(); PF.frame = null; }
  else if (S.view === "yatirim" && PF.frame) { await pfIdle(); PF.frame = null; }
  S.view = v; store.set("view", v);
  $$("[data-go]").forEach(b => b.toggleAttribute("aria-current", false));
  $(`[data-go="${v}"]`)?.setAttribute("aria-current", "page");
  // her geçişte yeni bir ana alan: önceki ekranın geç gelen verisi yeni ekranın üzerine yazamaz
  const old = $("#main"), m = old.cloneNode(false); old.replaceWith(m);
  m.classList.remove("full");
  // aynı ekran yeniden çiziliyorsa (kayıttan sonra) eski yükseklik ve kaydırma konumu korunur
  if (ayni) { m.style.minHeight = h + "px"; } else m.innerHTML = `<div class="loading">${T("Yükleniyor…")}</div>`;
  try { await VIEWS[v](m); }
  catch (e) { console.error(e); m.innerHTML = `<div class="panel"><div class="empty">${T("Veriler yüklenemedi:")} ${esc(errMsg(e))}<br><br><button class="btn" onclick="go('${v}')">${T("Tekrar dene")}</button></div></div>`; }
  if (ayni) { kaydirmaVer(k, m); setTimeout(() => { if (!m.isConnected) return; kaydirmaVer(k, m); m.style.minHeight = ""; }, 350); }
}

/* ---- tarih alanı: 12 → ayın 12'si · 12.10 → 12 Ekim · 121026 · b = bugün · d = dün · +3 / -3 · ↑/↓ ---- */

function evalAmount(s) {

   ÖZET
   ===================================================================== */
function nextDue(day) {
  if (!day) return null;
  const t = new Date(); t.setHours(0, 0, 0, 0);
  let d = new Date(t.getFullYear(), t.getMonth(), Math.min(day, new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate()));
  if (d < t) d = new Date(t.getFullYear(), t.getMonth() + 1, Math.min(day, new Date(t.getFullYear(), t.getMonth() + 2, 0).getDate()));
  return { date: d, days: Math.round((d - t) / 86400000) };
}
// İşletme bazında gelir, gider ve ödeme (Ödeme türü: depo ödemeleri, kredi taksitleri…; transferin iki ayağı birbirini götürür)
function isletmeOzet(rows) {
  const isl = new Map();
  for (const r of rows) {
    if (!["Gelir", "Gider", "Ödeme"].includes(r.tur)) continue;
    const k = r.isletme || T("İşletme belirtilmemiş"), o = isl.get(k) || { id: r.isletme_id, g: 0, c: 0, o: 0 };
    if (r.tur === "Gelir") o.g += +r.toplam; else if (r.tur === "Gider") o.c -= +r.toplam; else o.o -= +r.toplam;
    isl.set(k, o);
  }
  return [...isl.entries()].map(([k, o]) => [k, { ...o, n: o.g - o.c - o.o }]).filter(([, o]) => Math.abs(o.g) + Math.abs(o.c) + Math.abs(o.o) > 0.005).sort((a, b) => b[1].g - a[1].g || b[1].n - a[1].n);
}
function isletmeTablo(rows, pb, satir = () => "") {
  const top = k => rows.reduce((a, [, o]) => a + o[k], 0);
  return `<table class="t"><thead><tr><th>${T("İşletme")}</th><th class="r">${T("Gelir")}</th><th class="r">${T("Gider")}</th><th class="r">${T("Ödeme")}</th><th class="r">${T("Net")}</th></tr></thead><tbody>
    ${rows.map(([k, o]) => `<tr ${satir(o)}><td>${esc(k)}</td><td class="r num pos">${money(o.g, pb)}</td><td class="r num neg">${money(o.c, pb)}</td><td class="r num neg">${money(o.o, pb)}</td><td class="r num ${signCls(o.n)}">${money(o.n, pb)}</td></tr>`).join("")}
    <tr class="tot"><td>${T("Toplam")}</td><td class="r num">${money(top("g"), pb)}</td><td class="r num">${money(top("c"), pb)}</td><td class="r num">${money(top("o"), pb)}</td><td class="r num ${signCls(top("n"))}">${money(top("n"), pb)}</td></tr></tbody></table>
    <div class="sumrow"><span class="muted">${T("Net = gelir − gider − ödeme. Ödeme: depo ödemeleri, kredi taksitleri gibi \"Ödeme\" türündeki kategoriler.")}</span></div>`;
}

// limiti ortak kartlar Özet'te tek kart olarak görünür: bağlı kartın bakiyesi ana kartınkine eklenir (kullanılabilir limit ortak)
function kartBirlestir(rows, hepsi = rows) {
  const ek = new Map(), bagli = r => { const a = kartAna(hesap(r.hesap_id)); return a && a.id != r.hesap_id ? a : null; };
  for (const r of hepsi) { const a = bagli(r); if (a) { const k = a.id + "|" + r.para_birimi; ek.set(k, (ek.get(k) || 0) + +r.bakiye); } }
  return rows.filter(r => !bagli(r)).map(r => { const k = r.hesap_id + "|" + r.para_birimi; return ek.has(k) ? { ...r, bakiye: +r.bakiye + ek.get(k) } : r; });
}
function renderKartlar(kartlar, tl = kartlar) {

    <td class="r num">${k.kart_limit ? money(k.kart_limit, "TRY", { round: 1 }) : "—"}</td><td class="r num ${+k.bakiye < 0 ? "neg" : ""}">${money(k.bakiye)}</td><td class="r num">${k.kart_limit ? money(k.borc) : "—"}</td>
    <td>${k.kart_limit ? `<div class="bar ${pct > 85 ? "hi" : pct > 60 ? "mid" : ""}"><i style="width:${pct.toFixed(1)}%"></i></div><span class="faint" style="font-size:11.5px">%${nf0.format(pct)}</span>` : ""}</td>
    <td>${k.kesim_gunu ? `<span class="muted">${T("{a}. gün / {b}. gün", { a: k.kesim_gunu, b: k.son_odeme_gunu })}</span> ` : ""}${d && k.borc > 1 ? `<span class="badge ${d.days <= 3 ? "neg" : d.days <= 7 ? "warn" : ""}">${gunLabel(d.days)}</span>` : ""}</td></tr>`; }).join("")}
  </tbody></table>` : `<div class="empty">${T("Tanımlı kredi kartı yok. Hesaplar bölümünden kart ekleyebilirsiniz.")}</div>`}</div>`;
  $$("tr[data-h]", P).forEach(tr => tr.onclick = () => { setFilter({ hesap_id: tr.dataset.h }, "tumu"); go("hareketler"); });
}

function presetRange(p) {

  return { buay: monthRange(y, m), gecenay: monthRange(y, m - 1), son30: [isoOf(new Date(y, m, n.getDate() - 30)), todayISO()], buyil: [`${y}-01-01`, `${y}-12-31`], tumu: ["", ""] }[p];
}
const PRESETS = [["buay", "Bu ay"], ["gecenay", "Geçen ay"], ["son30", "Son 30 gün"], ["buyil", "Bu yıl"], ["tumu", "Tümü"], ["ozel", "Özel"]];
function setFilter(f, preset) {
  S.f = { from: "", to: "", kisi_id: "", hesap_id: "", isletme_id: "", kategori_id: "", tur: "", pb: "", q: "", ...f };
  if (preset) { S.preset = preset; if (preset !== "ozel") [S.f.from, S.f.to] = presetRange(preset); }
  S.page = 0;
}
[S.f.from, S.f.to] = presetRange("buay");
[S.depo.f.from, S.depo.f.to] = presetRange("buay");

function hesapOptions(sel, { all = false, onlyActive = true, filterTur, empty, kisi } = {}) {
  const groups = new Map();
  for (const h of S.lk.hesaplar) {
    if (onlyActive && h.aktif === false && h.id != sel) continue;
    if (kisi && h.kisi_id != kisi && h.id != sel) continue;
    if (filterTur && !filterTur.includes(h.tur) && h.id != sel) continue;
    const g = h.kisi_id ? kisiAd(h.kisi_id) : T("Sahipsiz"); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(h);
  }
  return `<option value="">${esc(empty || (all ? T("Tüm hesaplar") : T("Hesap seçin…")))}</option>` +
    [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0], "tr")).map(([g, hs]) => `<optgroup label="${esc(g)}">${hs.sort((a, b) => a.ad.localeCompare(b.ad, "tr")).map(h => `<option value="${h.id}" ${h.id == sel ? "selected" : ""}>${esc(h.ad)}${h.tur !== "Banka" ? ` (${esc(T(h.tur))})` : ""}</option>`).join("")}</optgroup>`).join("");
}
function kategoriOptions(sel, turler, { all = false, onlyActive = true } = {}) {
  const groups = new Map();
  for (const k of S.lk.kategoriler) {
    if (onlyActive && k.aktif === false && k.id != sel) continue;
    if (turler && !turler.includes(k.tur)) continue;
    const g = (turler && turler.length > 1 ? T(k.tur) + " · " : "") + (k.grup || T("Diğer")); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(k);
  }
  const order = g => (turler ? turler.map(t => T(t)).indexOf(g.split(" · ")[0]) : 0);
  return `<option value="">${esc(all ? T("Tüm kategoriler") : T("Kategori seçin…"))}</option>` +
    [...groups.entries()].sort((a, b) => order(a[0]) - order(b[0]) || a[0].localeCompare(b[0], "tr")).map(([g, ks]) => `<optgroup label="${esc(g)}">${ks.sort((a, b) => a.ad.localeCompare(b.ad, "tr")).map(k => `<option value="${k.id}" ${k.id == sel ? "selected" : ""}>${esc(k.ad)}</option>`).join("")}</optgroup>`).join("");
}

const belgeKalan = b => +b.tutar - +b.iade;

const onayKutu = r => `<label class="onay-cb" title="${esc(T("Kontrol ettim, onayla"))}"><input type="checkbox" data-onay="${r.id}" ${r.onay ? "checked" : ""} aria-label="${esc(T("Onay"))}"></label>`;

/* Seçilen tarihteki cari durum: veritabanı fonksiyonu yoksa tüm hareketlerden hesaplanır */
function depoTarihHesap(rows, t) {
  const ay = t.slice(0, 7), bak = new Map(), bel = new Map();
  for (const d of rows) {
    if (d.tarih > t) continue;
    const isl = depoIslem(d.islem_id), dp = S.lk.depolar.find(x => x.id == d.depo_id), net = (isl?.yon === "Giren" ? 1 : -1) * +d.tutar, k = d.isletme_id + "|" + d.depo_id;
    const r = bak.get(k) || { isletme_id: d.isletme_id, isletme: isletmeAd(d.isletme_id), depo_id: d.depo_id, depo: dp?.ad ?? "", depo_turu: dp?.tur ?? "Diğer", aktif: dp?.aktif !== false, bakiye: 0, bu_ay_alis: 0, adet: 0, son_tarih: null };
    r.bakiye += net; if (isl?.ad === "Alış Faturası" && d.tarih.slice(0, 7) === ay) r.bu_ay_alis += +d.tutar; r.adet++; if (!r.son_tarih || d.tarih > r.son_tarih) r.son_tarih = d.tarih; bak.set(k, r);
    if (isl?.belge) {
      const kb = [d.isletme_id, d.depo_id, isl.belge, d.vade].join("|");
      const b = bel.get(kb) || { isletme_id: d.isletme_id, isletme: isletmeAd(d.isletme_id), depo_id: d.depo_id, depo: dp?.ad ?? "", belge: isl.belge, vade: d.vade, tutar: 0, iade: 0, odenen: 0, verilis: null };
      if (isl.belge_tip === "giris") { b.tutar += +d.tutar; if (!b.verilis || d.tarih < b.verilis) b.verilis = d.tarih; } else if (isl.belge_tip === "iade") b.iade += +d.tutar; else if (isl.belge_tip === "odeme") b.odenen += +d.tutar;
      bel.set(kb, b);
    }
  }
  return { bak: [...bak.values()], bel: [...bel.values()] };
}

function chartSvg(g, c, upto, AYK) {
  const W = 560, H = 220, L = 58, B = 26, Tp = 10, Rr = 8, iw = W - L - Rr, ih = H - Tp - B;
  const max = Math.max(1, ...g, ...c);
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  const y = v => Tp + ih - (v / top) * ih, bw = iw / 12, w = Math.max(3, bw * 0.32);
  const ticks = []; for (let v = 0; v <= top + 1e-9; v += step) ticks.push(v);
  const short = v => v >= 1e6 ? new Intl.NumberFormat(LOC, { maximumFractionDigits: 1 }).format(v / 1e6) + " " + T("Mn") : v >= 1e3 ? nf0.format(v / 1e3) + " " + T("B") : nf0.format(v);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(T("Aylık gelir ve gider grafiği"))}">
    <g class="grid">${ticks.map(v => `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}"/>`).join("")}</g>
    ${ticks.map(v => `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${short(v)}</text>`).join("")}
    ${g.map((v, i) => { const x = L + i * bw + bw / 2; const dim = i + 1 > upto ? ' opacity=".35"' : "";
      return `<rect x="${x - w - 1}" y="${y(Math.max(0, v))}" width="${w}" height="${Math.max(0, ih + Tp - y(Math.max(0, v)))}" rx="2" fill="var(--pos)"${dim}><title>${ayAdi(i)} ${T("gelir")}: ${money(v)}</title></rect>
              <rect x="${x + 1}" y="${y(Math.max(0, c[i]))}" width="${w}" height="${Math.max(0, ih + Tp - y(Math.max(0, c[i])))}" rx="2" fill="var(--neg)"${dim}><title>${ayAdi(i)} ${T("gider")}: ${money(c[i])}</title></rect>
              <text x="${x}" y="${H - 8}" text-anchor="middle">${AYK[i]}</text>`; }).join("")}
  </svg>`;
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))), n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }

// son ödeme günü değişen kartın kesinleşmemiş ileri tarihli ödeme kalemleri yeni güne taşınır. Yalnız eski ödeme
// gününe (±5 gün) denk gelen kalemlere dokunulur; aynı hesaptaki başka düzende kalemler (ör. henüz ayrılmamış Troy) yerinde kalır.
// Tutarı girilmemiş (kendiliğinden açılmış) kalemler silinir, eşitleme yeni günlere yeniden açar; tutar yazılı olanlar
// en yakın yeni ödeme tarihine taşınır (her kalem ayrı bir tarihe, son kesinleşmiş ödemeden sonrasına).
async function kartTakvimGuncelle(c, eskiGun) {

  const acik = L.filter(x => x.tarih >= today && !x.odendi && !x.kesin && !x.hareket_id && eskiDuzen(x.tarih));
  const bos = acik.filter(x => Math.abs((+x.tutar || 0) - (+x.harcama || 0)) < 0.005), dolu = acik.filter(x => !bos.includes(x));
  if (bos.length) await S.api.nakitTopluSil(bos.map(x => x.id));
  // yeni ödeme tarihleri: bugünden ve son kesinleşmiş ödemeden (5 gün pay ile) sonra
  const K = [...L].reverse().find(x => (x.kesin || x.odendi) && eskiDuzen(x.tarih)), alt = K && addDays(K.tarih, 5) > today ? addDays(K.tarih, 5) : today;

  let n = 0;

  const baslangic = ac.toplam + gecikmis.reduce((s, r) => s + +r.net, 0);
  const byDay = new Map();
  for (const r of items) { if (r.tarih < today || r.tarih > end) continue; if (!byDay.has(r.tarih)) byDay.set(r.tarih, []); byDay.get(r.tarih).push(r); }
  let bal = baslangic, min = { bal, tarih: today }, giren = 0, cikan = 0; const gunler = [];
  for (const [t, rs] of [...byDay.entries()].sort((a, b) => a[0].localeCompare(b[0]))) {
    const g = rs.reduce((s, r) => s + Math.max(0, +r.net), 0), c = rs.reduce((s, r) => s + Math.max(0, -r.net), 0);

/* Tahmini bakiye grafiği: basamaklı çizgi, sıfırın altı kırmızı */
function nakitChart(P, genislik) {
  const W = Math.round(Math.max(480, Math.min(1600, genislik || 900))), H = 190, L = 66, R = 12, Tp = 12, Bt = 24, iw = W - L - R, ih = H - Tp - Bt;
  const t0 = todayISO(), last = P.gunler.length ? P.gunler[P.gunler.length - 1].tarih : t0;
  const tEnd = P.end !== "9999-12-31" ? P.end : last, span = Math.max(1, dayDiff(t0, tEnd));
  const pts = [{ x: 0, v: P.baslangic, t: t0 }].concat(P.gunler.filter(g => g.tarih <= tEnd).map(g => ({ x: dayDiff(t0, g.tarih), v: g.bakiye, t: g.tarih, g })));
  const vmin = Math.min(...pts.map(p => p.v)), vmax = Math.max(...pts.map(p => p.v));
  // sıfır çizgisi yalnızca bakiye sıfıra yaklaşıyorsa gösterilir; yoksa grafik değişime odaklanır
  let lo, hi; if (vmin > 0 && vmin > 0.35 * vmax) { const pad = Math.max(1, (vmax - vmin) * 0.12); lo = vmin - pad; hi = vmax + pad; } else { lo = Math.min(0, vmin); hi = Math.max(0, vmax); }
  if (hi - lo < 1) hi = lo + 1;
  const step = niceStep((hi - lo) / 4); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const X = x => L + (x / span) * iw, Y = v => Tp + ((hi - v) / (hi - lo)) * ih;
  let path = `M${X(0).toFixed(1)},${Y(pts[0].v).toFixed(1)}`; for (let i = 1; i < pts.length; i++) path += `H${X(pts[i].x).toFixed(1)}V${Y(pts[i].v).toFixed(1)}`; path += `H${X(span).toFixed(1)}`;
  const ticks = []; for (let v = lo; v <= hi + 1e-6; v += step) ticks.push(v);
  const xl = []; const n = Math.max(1, Math.min(Math.round(W / 130), span)); for (let k = 0; k <= n; k++) { const x = Math.round((span * k) / n); xl.push({ x, t: addDays(t0, x) }); }
  const z = Y(0);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(T("Tahmini nakit bakiyesi grafiği"))}">
    <defs><clipPath id="nkNeg"><rect x="${L}" y="${z}" width="${iw}" height="${Math.max(0, H - z)}"/></clipPath></defs>
    <g class="grid">${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/>`).join("")}</g>
    ${ticks.map(v => `<text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${nkShort(v)}</text>`).join("")}
    ${lo < 0 ? `<line class="zero" x1="${L}" x2="${W - R}" y1="${z}" y2="${z}"/>` : ""}
    ${xl.map((p, i) => `<text x="${X(p.x)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === xl.length - 1 ? "end" : "middle"}">${fdateShort(p.t)}</text>`).join("")}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <path d="${path}" fill="none" stroke="var(--neg)" stroke-width="2.4" stroke-linejoin="round" clip-path="url(#nkNeg)"/>
    ${pts.map((p, i) => { const x2 = i + 1 < pts.length ? pts[i + 1].x : span; const w = Math.max(2, X(x2) - X(p.x));
      return `<rect x="${X(p.x)}" y="${Tp}" width="${w}" height="${ih}" fill="transparent"><title>${fdate(p.t)} · ${T("bakiye")} ${money(p.v, "TRY", { round: 1 })}${p.g ? ` · ${T("giren")} ${money(p.g.giren, "TRY", { round: 1 })} · ${T("çıkan")} ${money(p.g.cikan, "TRY", { round: 1 })}` : ""}</title></rect>`; }).join("")}
    <circle cx="${X(dayDiff(t0, P.min.tarih))}" cy="${Y(P.min.bal)}" r="3.5" fill="${P.min.bal < 0 ? "var(--neg)" : "var(--accent)"}"><title>${T("En düşük nokta")}: ${fdate(P.min.tarih)} · ${money(P.min.bal, "TRY", { round: 1 })}</title></circle>
  </svg>`;
}

/* ---------- kredi kartı ödemeleri ----------
   Tüm aktif kredi kartları için son ödeme gününe (hafta sonuna denk gelirse pazartesiye) 1 yıl ileriye kadar
   "Kredi Kartı Ödemesi" kalemi açılır (tutar 0, tahmini). O dönem için kalem zaten varsa (±10 gün) atlanır.
   Karttan yapılan harcamalar hesap kesimi dönemlerine dağıtılır: tek çekim harcama, tarihini kapsayan ilk
   ekstreye; n taksitli harcama o ekstreden başlayarak n ekstreye eşit bölünerek eklenir. Her dönemin ilk
   tahmini ödeme kalemine o döneme düşen toplam yazılır; eklenen kısım "harcama" alanında tutulur, girilmiş
   tutarın üstüne eklenir. Kesinleşmiş (ya da ödenmiş) son ödemenin dönemi ve öncesi kapalıdır: o ekstre
   tutarı zaten bilindiği için bu dönemlere düşen taksitler eklenmez. */
let KART_UYARI = false;
// hafta sonuna denk gelen ödeme günü pazartesiye kayar; ayın günü ay sonunu aşmaz
const kartIsGunu = t => { const g = new Date(t + "T00:00:00").getDay(); return g === 6 ? addDays(t, 2) : g === 0 ? addDays(t, 1) : t; };
const kartAyGunu = (ay, g) => { const [y, m] = ay.split("-").map(Number); return `${ay}-${String(Math.min(g, new Date(y, m, 0).getDate())).padStart(2, "0")}`; };
const kartAyEkle = (ay, n) => ayKaydir(ay + "-01", n).slice(0, 7);
const TAKSIT_GERI_AY = 36;   // taksitli harcamalar için geriye bakılan süre (ay)
async function kartNakitEsitle() {
  const kk = rolKategori("kk_odeme"); if (!kk) return 0;
  const today = todayISO(), ufuk = ayKaydir(today, 12), ay0 = today.slice(0, 7) + "-01";
  const kartlar = S.lk.hesaplar.filter(h => h.tur === "Kredi Kartı" && h.aktif !== false); if (!kartlar.length) return 0;
  const isGunu = kartIsGunu, ayGunu = kartAyGunu, ayEkle = kartAyEkle;
  const getir = () => S.api.nakitListe({ from: addDays(today, -150), kategori_id: kk.id }, 0, 5000);
  let plan = await getir(), n = 0;
  { const r = await nkFazlaSil(plan, x => x.hesap_id + "|" + x.tarih); plan = r.plan; n += r.n; }   // aynı gün çoğalmış boş kalemler
  // 1) açılmamış dönemler
  const yeni = [];
  for (const c of kartlar) {
    if (!c.son_odeme_gunu) continue;
    const P = plan.filter(x => x.hesap_id == c.id);
    for (let m = 0; m <= 12; m++) {
      const T0 = isGunu(ayGunu(ayEkle(ay0.slice(0, 7), m), c.son_odeme_gunu));
      if (T0 < today || T0 > ufuk || P.some(x => Math.abs(dayDiff(x.tarih, T0)) <= 10)) continue;
      yeni.push({ tarih: T0, kisi_id: c.kisi_id ?? null, hesap_id: c.id, isletme_id: null, kategori_id: kk.id, yon: "Çıkan", tutar: 0, para_birimi: "TRY", kesin: false, odendi: false });
    }
  }
  if (yeni.length) { n += await nkEkleParca(yeni); plan = await getir(); }
  // 2) harcamaları dönemlere dağıt
  if (plan.length && !("harcama" in plan[0])) { if (!KART_UYARI) { KART_UYARI = true; toast(T("Kart harcamalarının nakit akışa eklenmesi için güncel kurulum.sql dosyasını Supabase'te bir kez çalıştırın."), true); } return n; }
  // ödeme tarihinden hesap kesim tarihi (kesim günü yoksa ödemeden 10 gün önce)
  const kesimOnce = (c, t) => { if (!c.kesim_gunu) return addDays(t, -10); let d = ayGunu(t.slice(0, 7), c.kesim_gunu); if (d > t) d = ayGunu(ayEkle(t.slice(0, 7), -1), c.kesim_gunu); return d; };
  const ilk = (L, t) => { for (let i = 0; i < L.length; i++) if (L[i] >= t) return i; return -1; };
  const kartB = [];
  for (const c of kartlar) {
    const P = plan.filter(x => x.hesap_id == c.id && x.para_birimi === "TRY").sort((a, b) => a.tarih.localeCompare(b.tarih) || a.id - b.id);
    if (!P.length) continue;
    // kesim günü olmayan kartta dönemler kalemlerden çıkar (15 günden yakın kesimler aynı dönem sayılır)
    let kalemD = null;
    if (!c.kesim_gunu) { kalemD = []; for (const s of [...new Set(P.map(x => kesimOnce(c, x.tarih)))].sort()) { if (kalemD.length && dayDiff(kalemD[kalemD.length - 1], s) < 15) kalemD[kalemD.length - 1] = s; else kalemD.push(s); } }
    const donemi = t => (c.kesim_gunu ? kesimOnce(c, t) : kalemD[ilk(kalemD, kesimOnce(c, t))]);
    const K = [...P].reverse().find(x => x.kesin || x.odendi), N = P.find(x => !x.kesin && !x.odendi && (!K || x.tarih > K.tarih));
    let kapanis = null;   // bu tarihe kadar kesilen ekstreler kapalı
    if (K) kapanis = donemi(K.tarih);
    else if (N) { const sN = donemi(N.tarih); kapanis = c.kesim_gunu ? ayGunu(ayEkle(sN.slice(0, 7), -1), c.kesim_gunu) : kalemD[kalemD.indexOf(sN) - 1] || ayKaydir(sN, -1); }
    kartB.push({ c, P, kalemD, donemi, kapanis });
  }
  const acik = kartB.filter(b => b.kapanis);
  // kapalı dönemdeki tahmini kalemlerde kalmış harcamayı geri al (açık dönemi olmayan kartlar)
  for (const b of kartB) if (!b.kapanis) for (const x of b.P) if (!x.kesin && !x.odendi && +x.harcama > 0) { await S.api.nakitGuncelle(x.id, { tutar: r2k((+x.tutar || 0) - +x.harcama), harcama: 0 }); n++; }
  if (!acik.length) return n;
  const alt = acik.reduce((m, b) => (b.kapanis < m ? b.kapanis : m), today), ids = acik.map(b => b.c.id);
  const [h1, h2] = await Promise.all([S.api.kartHareketleri(ids, alt), S.api.kartHareketleri(ids, ayKaydir(alt, -TAKSIT_GERI_AY), alt, true)]);
  // kart ödemesi, karta gelen transfer ve ortak limitli karta aktarılan açılış borcu harcama sayılmaz
  const hr = h1.concat(h2).filter(h => h.para_birimi === "TRY" && h.kategori_rol !== "kk_odeme" && !(h.transfer_id && h.yon === "Giren") && h.kaynak !== "ortak_devir");
  for (const { c, P, kalemD, donemi, kapanis } of acik) {
    const H = hr.filter(h => h.hesap_id == c.id);
    const enEski = H.reduce((m, h) => (h.tarih < m ? h.tarih : m), P[0].tarih);
    // dönem sonları (hesap kesim tarihleri), eskiden yeniye
    let D;

    else { D = [...kalemD]; while (D[0] >= enEski) D.unshift(ayKaydir(D[0], -1)); }

    for (const h of H) {

      const tk = Math.min(TAKSIT_GERI_AY, Math.max(1, Math.round(+h.taksit || 1))), top = (h.yon === "Çıkan" ? 1 : -1) * +h.tutar, parca = r2k(top / tk);
      for (let i = 0; i < tk && j + i < D.length; i++) {
        if (D[j + i] <= kapanis) continue;
        pay.set(j + i, (pay.get(j + i) || 0) + (i === tk - 1 ? top - parca * (tk - 1) : parca));
      }
    }
    // her açık dönemin ilk tahmini kalemi o dönemin harcamasını taşır, diğerleri sıfır

    for (const x of P) { if (x.kesin || x.odendi) continue; const s = donemi(x.tarih); if (s > kapanis) { const j = D.indexOf(s); if (j >= 0 && !sec.has(j)) sec.set(j, x); } }
    for (const x of P) {
      if (x.kesin || x.odendi) continue;
      const j = D.indexOf(donemi(x.tarih)), yeniH = sec.get(j) === x ? r2k(Math.max(0, pay.get(j) || 0)) : 0, eskiH = +x.harcama || 0;

async function exportNakitCsv() {

  if (!yillar.includes(o.yil)) o.yil = yillar.includes(new Date().getFullYear()) ? new Date().getFullYear() : yillar[0];
  const today = todayISO(), [rows, d] = await Promise.all([S.api.nakitAylik(o.yil), nakitVeri()]);
  const depoAll = nakitDepoKalemleri(d.bel, d.conf, isletmeSahibi(d.rows), d.rows);

/* ---------- plan kaydı formu ---------- */
function nkTarihler(bas, siklik, adet, pazarAtla) {
  if (!siklik) return [bas];
  const out = [], b = new Date(bas + "T00:00:00"), gun = b.getDate();
  for (let i = 0, k = 0; out.length < adet && k < adet * 3 + 10; k++) {
    let d;
    if (siklik === "gun") d = new Date(b.getFullYear(), b.getMonth(), gun + k);
    else if (siklik === "hafta") d = new Date(b.getFullYear(), b.getMonth(), gun + 7 * k);
    else if (siklik === "ay") { const last = new Date(b.getFullYear(), b.getMonth() + k + 1, 0).getDate(); d = new Date(b.getFullYear(), b.getMonth() + k, Math.min(gun, last)); }
    else { const last = new Date(b.getFullYear() + k, b.getMonth() + 1, 0).getDate(); d = new Date(b.getFullYear() + k, b.getMonth(), Math.min(gun, last)); }
    if (siklik === "gun" && pazarAtla && d.getDay() === 0) continue;
    out.push(isoOf(d)); i++;
  }
  return out;
}

    $("#wAdet", d).hidden = !s; $("#wPazar", d).hidden = s !== "gun";
    const ds = s ? nkTarihler(g("nTarih") || todayISO(), s, Math.max(2, Math.min(400, +g("nAdet") || 2)), $("#nPazar", d).checked) : [];
    $("#nTekHint", d).textContent = s ? T("{n} kayıt oluşur: {a} – {b}", { n: ds.length, a: fdate(ds[0]), b: fdate(ds[ds.length - 1]) }) : "";
  };
  ["nTekrar", "nAdet", "nPazar", "nTarih"].forEach(i => $("#" + i, d)?.addEventListener(i === "nAdet" ? "input" : "change", tekUpd)); tekUpd();
  const collect = () => {
    const tu = evalAmount(g("nTutar")), errs = [];
    if (!g("nTarih")) errs.push(T("tarih")); if (!g("nKat")) errs.push(T("kategori"));
    if (g("nTutar").trim() && isNaN(tu)) errs.push(T("tutar"));
    if (errs.length) { toast(T("Eksik veya hatalı:") + " " + errs.join(", "), true); return null; }
    const n = x => (x === "" || x == null ? null : +x);
    let tutar = isNaN(tu) ? null : tu, yon = v.yon;
    if (tutar != null && tutar < 0) { tutar = -tutar; yon = yon === "Giren" ? "Çıkan" : "Giren"; }
    return { tarih: g("nTarih"), yon, tutar, para_birimi: g("nPb") || "TRY", kategori_id: n(g("nKat")), isletme_id: n(g("nIsl")), kisi_id: n(g("nKisi")), hesap_id: n(g("nHesap")),
      aciklama1: g("nA1").trim() || null, aciklama2: g("nA2").trim() || null, kesin: $("#nKesin", d).checked };
  };
  let busy = false;
  const save = async andNew => {
    if (busy) return; const row = collect(); if (!row) return; busy = true;
    try {
      if (ed) {
        const odendi = $("#nOdendi", d).checked, extra = { odendi, ...(ed.hareket_id && !odendi ? { hareket_id: null } : {}) };
        let kapsam = "tek";
        if (ed.seri_id && !ed.odendi) {
          const n = await S.api.nakitSeriSayisi(ed.seri_id, ed.tarih);
          if (n > 1) { kapsam = await choiceBox(T("Bu kayıt tekrarlı bir serinin parçası. Değişiklik nereye uygulansın?"), [["tek", T("Yalnız bu kayıt")], ["sonra", T("Bu ve sonraki {n} kayıt", { n: n - 1 }), true]]); if (!kapsam) { busy = false; return; } }
        }
        if (kapsam === "sonra") {
          const { tarih, ...patch } = row;
          await S.api.nakitSeriGuncelle(ed.seri_id, ed.tarih, patch, dayDiff(ed.tarih, tarih));
          if (odendi) await S.api.nakitGuncelle(ed.id, extra);
          toast(T("Seri güncellendi"));
        } else { await S.api.nakitGuncelle(ed.id, { ...row, ...extra }); toast(T("Kayıt güncellendi")); }
      } else {
        const s = g("nTekrar"), ds = nkTarihler(row.tarih, s, Math.max(2, Math.min(400, +g("nAdet") || 2)), $("#nPazar", d).checked), seri = ds.length > 1 ? uuid() : null;
        await S.api.nakitEkle(ds.map(t => ({ ...row, tarih: t, seri_id: seri, odendi: false })));
        store.set("nakitLast", { kisi_id: row.kisi_id, isletme_id: row.isletme_id });
        toast(ds.length > 1 ? T("{n} plan kaydı oluşturuldu", { n: ds.length }) : T("Kaydedildi"));
      }
      if (andNew) { $("#nTutar", d).value = ""; $("#nA1", d).value = ""; $("#nA2", d).value = ""; $("#nTutar", d).focus(); } else closeDrawer();
      refreshView();
    } catch (e) { toast(errMsg(e), true); } finally { busy = false; }
  };
  $("#nCancel", d).onclick = closeDrawer;
  $("#nSave", d).onclick = () => save(false);
  $("#nSaveNew", d)?.addEventListener("click", () => save(true));
  $$("input", d).forEach(el => el.addEventListener("keydown", e => { if (e.key === "Enter" && el.type !== "checkbox") { e.preventDefault(); save(!ed); } }));
  $("#nDel", d)?.addEventListener("click", async () => {
    try {
      let kapsam = "tek";
      if (ed.seri_id && !ed.odendi) { const n = await S.api.nakitSeriSayisi(ed.seri_id, ed.tarih); if (n > 1) kapsam = await choiceBox(T("Bu kayıt tekrarlı bir serinin parçası. Hangileri silinsin?"), [["tek", T("Yalnız bu kayıt")], ["sonra", T("Bu ve sonraki {n} kayıt", { n: n - 1 })]]); }
      if (kapsam === "tek" && !(await confirmBox(ed.hareket_id ? T("Plan kaydı silinecek. Bağlı hesap hareketi silinmez.") : T("Bu plan kaydı kalıcı olarak silinecek.")))) return;
      if (!kapsam) return;
      if (kapsam === "sonra") await S.api.nakitSeriSil(ed.seri_id, ed.tarih); else await S.api.nakitSil(ed.id);
      toast(T("Silindi")); closeDrawer(); refreshView();
    } catch (e) { toast(errMsg(e), true); }
  });
  setTimeout(() => $("#nTutar", d)?.focus(), 30);
}

/* ---------- gerçekleşti: hesap hareketi oluştur / eşleştir / işaretle ---------- */
async function openNakitOde(r) {
  if (r.sanal === "depo") {
    const od = S.lk.depoIslemleri.find(x => x.belge === r.belge && x.belge_tip === "odeme" && x.odeme === "kredi_karti");
    return openDepoEntry({ values: { isletme_id: r.isletme_id, depo_id: r.depo_id, islem_id: od?.id, tutar: r.tutar, vade: r.tarih } });
  }
  const d = openDrawer(T("Gerçekleşti olarak işaretle"), `
    <dl class="kv"><dt>${T("Tarih")}</dt><dd>${fdate(r.tarih)}</dd><dt>${T("Kalem")}</dt><dd>${esc(r.kategori || "—")}</dd>
      ${nkKim(r) ? `<dt>${T("Kim / nerede")}</dt><dd>${esc(nkKim(r))}</dd>` : ""}${r.aciklama1 || r.aciklama2 ? `<dt>${T("Açıklama")}</dt><dd>${esc([r.aciklama1, r.aciklama2].filter(Boolean).join(" · "))}</dd>` : ""}
      <dt>${T("Tutar")}</dt><dd class="num">${nkTutar(r)}</dd></dl>
    <div class="inv-box"><span class="ttl">${T("Hesap hareketi olarak kaydet")}</span>
      <div class="hint">${T("Hesap hareketi formu bu bilgilerle açılır. Kaydedince plan kaydı gerçekleşti olarak işaretlenir ve harekete bağlanır.")}</div>
      <div><button class="btn primary" id="oYeni">${T("Hesap hareketi oluştur")}</button></div></div>
    <div class="inv-box"><span class="ttl">${T("Girilmiş bir hareketle eşleştir")}</span><div id="oAday"><div class="loading" style="padding:12px">${T("Aranıyor…")}</div></div></div>
    <div class="inv-box"><span class="ttl">${T("Sadece işaretle")}</span>
      <div class="hint">${T("Hesap hareketi gerekmiyorsa (örneğin nakit ödendi ya da başka yerde kayıtlı).")}</div>
      <div><button class="btn" id="oSadece">${r.yon === "Giren" ? T("Tahsil edildi olarak işaretle") : T("Ödendi olarak işaretle")}</button></div></div>`,
    `<button class="btn" id="oKapat">${T("Vazgeç")}</button>`);
  const bitti = msg => { toast(msg); closeDrawer(); refreshView(); };
  $("#oKapat", d).onclick = closeDrawer;
  $("#oSadece", d).onclick = async () => { try { await S.api.nakitGuncelle(r.id, { odendi: true }); bitti(T("İşaretlendi")); } catch (e) { toast(errMsg(e), true); } };
  $("#oYeni", d).onclick = () => {
    const k = kategori(r.kategori_id), hs = hesap(r.hesap_id), today = todayISO();
    const values = { tarih: r.tarih < today ? r.tarih : today, kategori_id: r.kategori_id || "", isletme_id: r.isletme_id || "", tutar: r.tutar ?? null, para_birimi: r.para_birimi, aciklama1: r.aciklama1, aciklama2: r.aciklama2 };
    let mode = r.yon === "Giren" ? "giris" : "cikis";
    if (k?.rol === "kk_odeme" && hs?.tur === "Kredi Kartı") { mode = "transfer"; values.karsi_hesap_id = hs.id; values.aciklama1 = r.aciklama1 || null; }
    else if (hs && ["Banka", "Kasa", "Kredi Kartı"].includes(hs.tur)) values.hesap_id = hs.id;
    if (k?.rol === "depo_odeme" && r.aciklama1) { const n = nkNorm(r.aciklama1).replace(/\.$/, ""); const dp = S.lk.depolar.find(x => nkNorm(x.ad).replace(/\.$/, "") === n) || S.lk.depolar.find(x => nkNorm(x.ad).startsWith(n.split(" ")[0])); if (dp) { values.depo_id = dp.id; values.depo_borc = "Açık Hesap"; } }
    closeDrawer();
    openEntry({ mode, values, tek: true, baslik: T("Plan kalemini öde"),
      onSaved: async (ids, rows) => {
        const h = rows[0], net = (h.yon === "Giren" ? 1 : -1) * +h.tutar;
        await S.api.nakitGuncelle(r.id, { odendi: true, hareket_id: ids[0], tarih: h.tarih, ...(h.para_birimi === r.para_birimi ? { tutar: Math.abs(net), yon: net >= 0 ? "Giren" : "Çıkan" } : {}), kesin: true });
        toast(T("Plan kaydı gerçekleşti olarak işaretlendi"));
      } });
  };
  // aday hareketler: ±10 gün, aynı kategori, tutar %2 yakın, henüz bağlanmamış
  try {
    const from = addDays(r.tarih, -10), to = addDays(r.tarih > todayISO() ? r.tarih : todayISO(), 10);
    const list = await S.api.liste({ from, to, ...(r.kategori_id ? { kategori_id: r.kategori_id } : {}) }, 0, 400);
    const want = r.yon === "Giren" ? 1 : -1;
    const ad = list.filter(h => !h.nakit_id && h.para_birimi === r.para_birimi && Math.sign(+h.net) === want && (r.tutar == null || Math.abs(Math.abs(+h.net) - +r.tutar) <= Math.max(1, +r.tutar * 0.02)))
      .sort((a, b) => Math.abs(dayDiff(r.tarih, a.tarih)) - Math.abs(dayDiff(r.tarih, b.tarih)) || Math.abs(Math.abs(+a.net) - (+r.tutar || 0)) - Math.abs(Math.abs(+b.net) - (+r.tutar || 0))).slice(0, 6);
    const A = $("#oAday", d); if (!A) return;
    A.innerHTML = ad.length ? `<div class="tw"><table class="t"><tbody>${ad.map((h, i) => `<tr><td><label class="switch"><input type="radio" name="oA" value="${i}" ${i === 0 ? "checked" : ""}> ${fdate(h.tarih)}</label></td><td class="acc-cell"><b>${esc(h.kategori || "—")}</b><small>${esc([h.kisi, h.hesap, h.isletme].filter(Boolean).join(" · "))}</small></td><td class="r num ${signCls(+h.net)}">${money(h.net, h.para_birimi)}</td></tr>`).join("")}</tbody></table></div>
      <div><button class="btn" id="oEs">${T("Seçili hareketle eşleştir")}</button></div>` : `<div class="hint">${T("Tarihi ve tutarı yakın, henüz bağlanmamış bir hareket bulunamadı.")}</div>`;
    $("#oEs", A)?.addEventListener("click", async () => {
      const h = ad[+($("input[name=oA]:checked", A)?.value ?? 0)];
      try { await S.api.nakitGuncelle(r.id, { odendi: true, hareket_id: h.id, tarih: h.tarih, tutar: Math.abs(+h.net), yon: +h.net >= 0 ? "Giren" : "Çıkan", kesin: true }); bitti(T("Harekete bağlandı")); } catch (e) { toast(errMsg(e), true); }
    });
  } catch (e) { const A = $("#oAday", d); if (A) A.innerHTML = `<div class="hint">${esc(errMsg(e))}</div>`; }
}

/* ---------- Özet sayfası paneli: gecikmiş ve bugünkü ödeme / tahsilatlar (iki sütun) ---------- */
async function renderNakitPanel(pre) {
  const P0 = $("#nkPanel"); if (!P0) return;
  try {
    const dv = await nakitVeri(pre); if (!P0.isConnected) return;
    const P = nakitProjeksiyon(dv, { ufuk: 30 }), today = todayISO();
    const gec = P.gecikmis, bug = P.gunler.find(g => g.tarih === today)?.rows || [];   // tutarı 0 olanlar (ör. nöbet) dahil hepsi
    const head = `<div class="panel-h"><h2>${T("Ödeme ve tahsilatlar")}</h2><button class="btn sm ghost" data-go3="nakit">${T("Nakit akışa git →")}</button></div>`;
    if (!dv.rows.length && !P.items.length) { P0.innerHTML = head + `<div class="empty">${T("Henüz plan kaydı yok. Nakit akış bölümünden ödeme ve tahsilatlarınızı planlayabilirsiniz.")}</div>`; }
    else {
      const max = 10;
      const satir = r => `<tr class="click" data-nk="${esc(r.id)}">${r.tarih < today ? `<td class="num muted" style="white-space:nowrap;width:1%">${fdateShort(r.tarih)} <span class="badge neg">${gunLabel(daysUntil(r.tarih))}</span></td>` : ""}<td class="acc-cell"><b>${esc(r.kategori || "—")}</b>${nkRozetler(r)}<small>${esc([nkKim(r), r.aciklama1].filter(Boolean).join(" · "))}</small></td><td class="r num">${nkTutar(r)}</td><td class="r act"><button class="btn sm ok" data-nkode="${esc(r.id)}" aria-label="${esc(T("Gerçekleşti olarak işaretle"))}">✓</button></td></tr>`;
      const sutun = (baslik, list, bos, cls) => {
        const g = list.reduce((s, r) => s + Math.max(0, +r.net), 0), c = list.reduce((s, r) => s + Math.max(0, -r.net), 0);
        return `<div class="nk-col"><div class="nk-col-h"><b>${baslik}</b><span class="badge ${list.length ? cls : ""}">${list.length}</span>${list.length ? `<span class="num"><span class="pos">+${money(g)}</span> · <span class="neg">−${money(c)}</span></span>` : ""}</div>
          ${list.length ? `<div class="tw nk-scroll"><table class="t"><tbody>${list.map(satir).join("")}</tbody></table></div>` : `<div class="empty">${bos}</div>`}</div>`;
      };
      P0.innerHTML = head + `<div class="nk-mini"><span>${T("Bugünkü nakit")} <b class="num">${money(P.ac.toplam)}</b></span><span>${T("30 gün sonra")} <b class="num ${signCls(P.son)}">${money(P.son)}</b></span><span>${T("En düşük")} <b class="num ${P.min.bal < 0 ? "neg" : ""}">${money(P.min.bal)}</b> <span class="muted">${fdate(P.min.tarih)}</span></span></div>
        <div class="nk-cols">${sutun(T("Gecikmiş"), gec, T("Gecikmiş ödeme veya tahsilat yok."), "neg")}${sutun(T("Bugün") + " · " + fdate(today), bug, T("Bugün için bekleyen ödeme veya tahsilat yok."), "acc")}</div>`;
      nkBagla(P0, [...gec, ...bug]);
      // 10 satır görünür, fazlası kutunun içinde aşağı kayar
      $$(".nk-scroll", P0).forEach(w => { const tr = w.querySelectorAll("tbody tr"); if (tr.length > max) w.style.maxHeight = tr[max].offsetTop + "px"; });
    }
    $$("[data-go3]", P0).forEach(b => b.onclick = () => { S.nakit.tab = "plan"; store.set("nakitTab", "plan"); go("nakit"); });
  } catch (e) { P0.innerHTML = `<div class="empty">${T("Nakit akış yüklenemedi:")} ${esc(errMsg(e))}</div>`; }
}

      nakit: na.map(x => strip({ t: x.tarih, k: kAd(x.kisi_id), h: H.get(x.hesap_id), i: I.get(x.isletme_id), c: K.get(x.kategori_id), y: x.yon, tu: x.tutar == null ? null : +x.tutar, pb: x.para_birimi, a1: x.aciklama1, a2: x.aciklama2, ks: x.kesin ? 1 : null, od: x.odendi ? 1 : null, s: x.seri_id, hx: x.hareket_id != null ? hIdx.get(x.hareket_id) ?? null : null, hc: +x.harcama ? +x.harcama : null })),
      kasa: ka.map(x => strip({ t: x.tarih, i: I.get(x.isletme_id), dv: x.devir == null ? null : +x.devir, ng: x.nakit_giris == null ? null : +x.nakit_giris, gs: x.gun_sonu == null ? null : +x.gun_sonu, p: x.pos == null ? null : +x.pos, pt: x.pos_transfer == null ? null : +x.pos_transfer, hv: x.havale == null ? null : +x.havale, bg: x.bloke_gun, a: x.aciklama })),
      yatirim_esleme: Object.fromEntries([...pfEsleme()].map(([pf, hid]) => [pf, H.get(hid)]).filter(([, k]) => k)),

/* =====================================================================
   KASA — eczanelerin günlük kasa sayımı, POS ve havale tahsilatları
   Excel'deki "Kasa Hareketleri" ve "Kasa Özeti" sayfalarının karşılığı.
   Her işletme için günde bir satır girilir; şunlar hesaplanır:
     kasa farkı        = gün sonu − nakit giriş − devir
     kasadan alınan    = gün sonu − ertesi günün devri
     banka toplamı     = POS + POS hesaba transfer + havale
     toplam tahsilat   = gün sonu − devir + banka toplamı
     POS çözüm tarihi  = tarih + bloke gün + 1 (o gün hesaba geçecek tutar)
   ===================================================================== */
const KASA_TABS = [["gunluk", "Günlük"], ["pos", "POS blokesi"], ["ozet", "Aylık özet"]];
S.kasa = { tab: store.get("kasaTab", "gunluk"), preset: "buay", from: "", to: "", isletme_id: "", yil: new Date().getFullYear(), sadeceFark: false };
[S.kasa.from, S.kasa.to] = presetRange("buay");
const QK = { v: null, oturum: new Set() };
const kn = v => (v == null || v === "" || isNaN(+v) ? null : +v);
const r2k = v => Math.round(v * 100) / 100;
const kf = v => (v == null || v === "" ? "" : +v === 0 ? `<span class="faint">0</span>` : nf2.format(+v));
const kasaTabloYok = e => !!e && (e.code === "42P01" || e.code === "PGRST205" || (/kasa/i.test(e.message || "") && /does not exist|schema cache|could not find/i.test(e.message || "")));

function kasaHesapla(raw) {
  const rows = raw.map(r => ({ ...r })), byI = new Map(), cz = new Map();
  for (const r of rows) { if (!byI.has(r.isletme_id)) byI.set(r.isletme_id, []); byI.get(r.isletme_id).push(r); }
  for (const L of byI.values()) {
    L.sort((a, b) => a.tarih.localeCompare(b.tarih));
    L.forEach((r, i) => {
      const dv = kn(r.devir) || 0, gs = kn(r.gun_sonu), ng = kn(r.nakit_giris) || 0, nx = L[i + 1];
      r.banka = r2k((kn(r.pos) || 0) + (kn(r.pos_transfer) || 0) + (kn(r.havale) || 0));
      r.pos_toplam = kn(r.pos) == null && kn(r.pos_transfer) == null ? null : r2k((kn(r.pos) || 0) + (kn(r.pos_transfer) || 0));
      r.fark = gs == null ? null : r2k(gs - ng - dv);
      r.alinan = gs != null && nx && kn(nx.devir) != null ? r2k(gs - kn(nx.devir)) : null;
      r.tahsilat = gs == null ? null : r2k(gs - dv + r.banka);
      r.cozum = kn(r.pos) ? addDays(r.tarih, (r.bloke_gun ?? 10) + 1) : null;
      if (r.cozum) { const k = r.isletme_id + "|" + r.cozum; cz.set(k, r2k((cz.get(k) || 0) + +r.pos)); }
    });
  }
  return { rows, cz, byI };
}
// kasası tutulan işletmeler: son 120 günde kaydı olanlar; hiç yoksa tüm aktif işletmeler
function kasaIsletmeleri(rows) {
  const sinir = addDays(todayISO(), -120), ids = [...new Set(rows.filter(r => r.tarih >= sinir).map(r => r.isletme_id))];
  const L = ids.length ? ids.map(id => S.lk.isletmeler.find(i => i.id == id)).filter(Boolean) : S.lk.isletmeler.filter(i => i.aktif !== false);
  return L.sort((a, b) => a.ad.localeCompare(b.ad, "tr"));
}

// Ekrandaki alanlar: POS toplam (POS gün sonu) ve POS hesaba transfer girilir, POS bloke = toplam − transfer olarak saklanır.
// Kasadan alınan girilince ertesi günün devri = gün sonu − alınan olarak yazılır (ertesi gün satırı yoksa açılır).
const KASA_UI = ["devir", "nakit_giris", "gun_sonu", "alinan", "pos_toplam", "pos_transfer", "havale"];
function kasaSatiri(v) {
  const errs = [];
  if (v.pos_toplam == null && v.pos_transfer != null) errs.push(["pos_toplam", T("POS toplam")]);
  const pos = v.pos_toplam == null ? null : r2k(v.pos_toplam - (v.pos_transfer || 0));

    else if (v.alinan < 0 || v.alinan > v.gun_sonu) errs.push(["alinan", T("alınan, gün sonundan büyük olamaz")]);
  }
  return { errs, row: { devir: v.devir, nakit_giris: v.nakit_giris, gun_sonu: v.gun_sonu, pos, pos_transfer: v.pos_transfer, havale: v.havale },
    ertesiDevir: v.alinan != null && v.gun_sonu != null ? r2k(v.gun_sonu - v.alinan) : null };
}

// giriş satırı
function kasaGiris(B, today) {
  const isls = () => kasaIsletmeleri(QK.rows || []);
  if (!QK.v) QK.v = kasaSiradaki(QK.rows || [], isls());
  const V = QK.v;
  const IDS = { devir: "kqDv", nakit_giris: "kqNg", gun_sonu: "kqGs", alinan: "kqAl", pos_toplam: "kqPtop", pos_transfer: "kqPt", havale: "kqHv" };
  const F = Object.fromEntries(KASA_UI.map(k => [k, amountField($("#" + IDS[k], B))]));
  const bg = $("#kqBg", B), ac = $("#kqA", B); selectOnFocus(bg); selectOnFocus(ac);
  let mevcut = null, onceki = null, yTok = 0, yukP = Promise.resolve();
  const deger = k => { const x = evalAmount($("#" + IDS[k], B).value); return isNaN(x) ? null : x; };
  const onizle = () => {
    const dv = deger("devir") || 0, ng = deger("nakit_giris") || 0, gs = deger("gun_sonu"), al = deger("alinan"), ptop = deger("pos_toplam"), pt = deger("pos_transfer") || 0, hv = deger("havale") || 0;
    const b = parseInt(bg.value, 10), bgun = isNaN(b) ? 10 : b;
    const bloke = ptop == null ? null : r2k(ptop - pt), banka = r2k((ptop ?? pt) + hv);
    const fark = gs == null ? null : r2k(gs - ng - dv), tah = gs == null ? null : r2k(gs - dv + banka);
    const pF = $("#kpF", B); pF.textContent = fark == null ? "" : nf2.format(fark); pF.className = "pv" + (fark != null && Math.abs(fark) >= 1 ? (fark < 0 ? " neg" : " pos") : "");
    const pB = $("#kpPb", B); pB.textContent = bloke == null ? "" : nf2.format(bloke); pB.className = "pv" + (bloke != null && bloke < 0 ? " neg" : "");
    $("#kpB", B).textContent = banka ? nf2.format(banka) : ""; $("#kpT", B).textContent = tah == null ? "" : nf2.format(tah);
    $("#kpC", B).textContent = bloke > 0 && V.tarih ? fdateShort(addDays(V.tarih, bgun + 1)) : "";
    const N = $("#kqNote", B), msg = [];
    if (mevcut) msg.push(T("Bu gün ve eczane için kayıt var; Enter ile güncellenir."));
    if (al != null && gs != null && V.tarih) msg.push(T("Ertesi gün ({t}) devri: {a}", { t: fdate(addDays(V.tarih, 1)), a: money(r2k(gs - al)) }));
    else if (onceki && kn(onceki.gun_sonu) != null && deger("devir") != null) msg.push(T("Önceki gün ({t}) gün sonu {a} · kasadan alınan {b}", { t: fdate(onceki.tarih), a: money(onceki.gun_sonu), b: money(r2k(onceki.gun_sonu - deger("devir"))) }));
    N.hidden = !msg.length; N.innerHTML = msg.map(x => `<span>${esc(x)}</span>`).join("");
  };
  // kullanıcı yazmaya başladıysa, geç gelen yükleme o alanın üzerine yazmaz
  const dokunma = new Map();
  for (const id of Object.values(IDS).concat(["kqBg", "kqA"])) $("#" + id, B).addEventListener("input", () => { dokunma.set(id, Date.now()); onizle(); });
  const yukle = () => (yukP = yukle0());
  const yukle0 = async () => {
    const my = ++yTok, bas = Date.now(), t = V.tarih, isl = V.isletme_id;
    const set = (id, fn) => { if ((dokunma.get(id) || 0) <= bas) fn(); };
    if (!t || !isl) { mevcut = onceki = null; onizle(); return; }
    let L; try { L = await S.api.kasaAralik(addDays(t, -20), addDays(t, 7)); } catch (e) { toast(errMsg(e), true); return; }
    if (my !== yTok) return;
    const mine = L.filter(r => r.isletme_id == isl).sort((a, b) => a.tarih.localeCompare(b.tarih));
    mevcut = mine.find(r => r.tarih === t) || null; onceki = [...mine].reverse().find(r => r.tarih < t) || null;
    const sonraki = mine.find(r => r.tarih > t), gs = mevcut ? kn(mevcut.gun_sonu) : null;
    const v = mevcut ? { devir: kn(mevcut.devir), nakit_giris: kn(mevcut.nakit_giris), gun_sonu: gs, alinan: gs != null && sonraki && kn(sonraki.devir) != null ? r2k(gs - kn(sonraki.devir)) : null,
        pos_toplam: kasaPosToplam(mevcut), pos_transfer: kn(mevcut.pos_transfer), havale: kn(mevcut.havale) }
      : { devir: onceki ? kn(onceki.gun_sonu) ?? kn(onceki.devir) : null };
    for (const k of KASA_UI) set(IDS[k], () => F[k].set(v[k] ?? null));
    set("kqBg", () => { bg.value = mevcut?.bloke_gun ?? onceki?.bloke_gun ?? 10; });
    set("kqA", () => { ac.value = mevcut?.aciklama || ""; });
    $$(".bad", B).forEach(x => x.classList.remove("bad"));
    onizle();
    const a = document.activeElement; if (a && a.closest(".qg-kasa tr.qrow") && a.select && a.id !== "kqI") a.select();   // odaktaki alan yeni değerle seçili kalsın
  };
  const tF = dateField($("#kqT", B), { value: V.tarih, onChange: v => { V.tarih = v; yukle(); } });
  const iC = comboBox($("#kqI", B), { key: "kasaIsl", value: V.isletme_id, allowClear: true, options: () => { const k = isls(); return k.concat(S.lk.isletmeler.filter(i => i.aktif !== false && !k.includes(i))).map(i => ({ v: i.id, l: i.ad })); }, onPick: v => { V.isletme_id = v; yukle(); } });
  const git = (t, isl) => { V.tarih = t; V.isletme_id = isl ? String(isl) : ""; tF.set(V.tarih); iC.set(V.isletme_id, false); dokunma.clear(); yukle(); };
  $("#kqClr", B).onclick = () => { for (const k of KASA_UI) F[k].set(null); bg.value = 10; ac.value = ""; dokunma.clear(); git(todayISO(), ""); $("#kqT", B).focus(); };
  const row = $(".qg-kasa tr.qrow", B);
  let busy = false;
  const kaydet = async () => {
    if (busy) return;
    await yukP;   // tarih/eczane yeni değiştiyse önce o günün kaydı yüklensin
    const t = tF.get(), isl = V.isletme_id, errs = [], v = {};
    if (!t) errs.push(["kqT", T("tarih")]); if (!isl) errs.push(["kqI", T("işletme")]);
    for (const k of KASA_UI) { const raw = $("#" + IDS[k], B).value.trim(), x = F[k].get(); if (raw && isNaN(x)) errs.push([IDS[k], T("tutar")]); v[k] = isNaN(x) ? null : x; }
    const b = bg.value.trim() === "" ? 10 : Number(bg.value); if (!Number.isInteger(b) || b < 0 || b > 90) errs.push(["kqBg", T("bloke gün (0–90)")]);
    const ks = kasaSatiri(v); for (const [k, m] of ks.errs) errs.push([IDS[k], m]);
    const aciklama = ac.value.trim() || null;
    if (!errs.length && KASA_UI.every(k => v[k] == null) && !aciklama) errs.push(["kqDv", T("en az bir tutar")]);
    if (errs.length) { errs.forEach(([id]) => $("#" + id, B).classList.add("bad")); toast(T("Eksik veya hatalı:") + " " + errs.map(x => x[1]).join(", "), true); $("#" + errs[0][0], B).focus(); return; }
    busy = true; row.classList.add("busy");
    try {

      // sıradaki: aynı gün gün sonu girilmemiş eczane, yoksa ertesi gün

// ilk açılışta: son tarihte gün sonu eksik eczane, yoksa ertesi gün
function kasaSiradaki(rows, isls) {
